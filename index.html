<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 이슈 관리 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEBE3;
    --card:#FBFAF6;
    --ink:#232620;
    --ink-soft:#5B5A52;
    --line:#D8D5C9;
    --c-hist:#2C3E63;
    --c-hist-bg:#E4E8F0;
    --c-disaster:#3F3D3A;
    --c-disaster-bg:#E5E3DF;
    --c-culture:#B5473F;
    --c-culture-bg:#F4E3DF;
    --c-season:#5F7A55;
    --c-season-bg:#E6ECDD;
    --c-global:#A9791F;
    --c-global-bg:#F1E7CF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    padding:28px 16px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;}
  .head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
    border-bottom:2px solid var(--ink);
    padding-bottom:18px;
    margin-bottom:20px;
  }
  .head h1{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:34px;
    line-height:1.15;
    margin:0;
  }
  .head h1 small{
    display:block;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:500;
    font-size:14px;
    color:var(--ink-soft);
    margin-top:6px;
    letter-spacing:.02em;
  }
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    max-width:420px;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    padding:5px 10px 5px 8px;
    border-radius:100px;
    border:1px solid var(--line);
    background:var(--card);
    cursor:pointer;
    user-select:none;
    transition:opacity .15s ease, transform .1s ease;
    color:var(--ink);
    line-height:1.2;
  }
  .chip:active{transform:scale(0.97);}
  .chip.off{opacity:.35;}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .monthnav{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:18px;
  }
  .mbtn{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    font-family:'Noto Sans KR', sans-serif;
    font-size:13.5px;
    font-weight:500;
    padding:7px 12px;
    border-radius:8px;
    cursor:pointer;
  }
  .mbtn.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
    font-weight:700;
  }
  .mbtn.today-nav{
    border:1px solid transparent;
    background:linear-gradient(var(--card),var(--card)) padding-box,
      linear-gradient(130deg,#F2FFFA 0%,#72B8A9 25%,#246F67 52%,#B7E5D8 76%,#397D75 100%) border-box;
    color:#285D55;
    padding:0 12px;
    height:34px;
    display:inline-flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:1px;
    line-height:1;
    box-sizing:border-box;
  }
  .mbtn.today-nav .today-ko{font-size:12px;font-weight:700;line-height:14px;}
  .mbtn.today-nav .today-en{
    display:inline-block;
    background:#397D75;
    color:#fff;
    border-radius:999px;
    font-size:7px;
    font-weight:700;
    letter-spacing:.01em;
    line-height:9px;
    padding:0 4px;
  }
  .cal-title{
    font-family:'Noto Serif KR', serif;
    font-size:22px;
    font-weight:700;
    margin:6px 0 12px;
  }
  .cal-title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .cal-summary{font-size:12px;color:var(--ink-soft);font-weight:400;white-space:nowrap;}
  .grid{
    display:grid;
    grid-template-columns:repeat(7, minmax(0,1fr));
    gap:6px;
    width:100%;
  }
  .wd{
    text-align:center;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    padding-bottom:4px;
  }
  .wd.sun{color:#B5473F;}
  .wd.sat{color:#2C3E63;}
  .cell{
    min-height:78px;
    min-width:0;
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 6px 8px;
    position:relative;
    overflow:hidden;
  }
  .cell.empty{background:transparent;border-color:transparent;}
  .cell.clickable{cursor:pointer;}
  .cell.clickable:hover{border-color:var(--ink);}
  .cell.today{border:2px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(130deg,#F2FFFA 0%,#72B8A9 25%,#246F67 52%,#B7E5D8 76%,#397D75 100%) border-box;box-shadow:0 0 0 1px rgba(36,111,103,.14),0 1px 5px rgba(36,111,103,.12);outline:none;padding:5px 5px 7px;}
  .cell.today .daynum{display:inline-flex;align-items:center;gap:5px;width:auto;height:auto;border-radius:0;background:none;color:var(--ink)!important;box-shadow:none;}
  .cell.today .daynum::after{content:'TODAY';display:inline-block;background:#397D75;color:#fff;border-radius:10px;font-size:8px;font-weight:700;letter-spacing:.025em;line-height:1;padding:3px 5px;}
  .cell.today.clickable:hover{border-color:transparent;}
  .daynum{
    font-size:13px;
    font-weight:700;
    color:var(--ink);
  }
  .cell.sun .daynum{color:#B5473F;}
  .cell.sat .daynum{color:#2C3E63;}
  .dots{
    display:flex;
    flex-wrap:wrap;
    gap:3px;
    margin-top:6px;
  }
  .ev-label{
    font-size:10.5px;
    line-height:1.3;
    color:var(--ink);
    margin-top:4px;
    display:block;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .note{
    margin-top:22px;
    font-size:12.5px;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
    padding-top:14px;
    line-height:1.6;
  }
  .cat-panel{
    display:none;
    margin:8px 0 22px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .cat-panel.show{display:block;}
  .cat-panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:15px 17px;
    border-bottom:1px solid var(--line);
  }
  .cat-panel-title{
    font-family:'Noto Serif KR', serif;
    font-size:18px;
    font-weight:700;
    margin:0;
  }
  .cat-panel-count{
    font-size:11.5px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .cat-list{padding:6px 10px 10px;}
  .cat-item{
    display:grid;
    grid-template-columns:88px 10px minmax(0,1fr) 18px;
    align-items:center;
    gap:9px;
    width:100%;
    border:0;
    border-bottom:1px solid var(--line);
    background:transparent;
    padding:12px 7px;
    text-align:left;
    color:var(--ink);
    cursor:pointer;
    font-family:'Noto Sans KR', sans-serif;
  }
  .cat-item:last-child{border-bottom:0;}
  .cat-item:hover{background:var(--paper);}
  .cat-date{
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .cat-dot{
    width:8px;height:8px;border-radius:50%;
  }
  .cat-name{
    min-width:0;
    font-size:13.5px;
    font-weight:700;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .cat-arrow{
    font-size:18px;
    color:var(--ink-soft);
    text-align:center;
  }
  .cat-empty{
    padding:18px 10px;
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
  }
  .chip.selected{
    border-color:var(--ink);
    box-shadow:0 0 0 1px var(--ink) inset;
  }
  .overlay{
    position:fixed;inset:0;
    background:rgba(35,38,32,.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--card);
    max-width:460px;
    width:100%;
    max-height:82vh;
    overflow-y:auto;
    border-radius:14px;
    padding:22px 22px 20px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .modal-date{
    font-family:'Noto Serif KR', serif;
    font-size:20px;
    font-weight:700;
    margin:0 0 14px;
  }
  .ev-card{
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 15px;
    margin-bottom:12px;
  }
  .ev-card:last-child{margin-bottom:0;}
  .badge{
    display:inline-block;
    font-size:11.5px;
    font-weight:700;
    padding:3px 9px;
    border-radius:100px;
    margin-bottom:8px;
  }
  .ev-title{
    font-size:16.5px;
    font-weight:700;
    margin:0 0 10px;
  }
  .ev-sec-label{
    font-size:11.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:3px;
  }
  .ev-sec-text{
    font-size:13.5px;
    line-height:1.6;
    margin:0 0 10px;
  }
  .caution-box{
    background:var(--paper);
    border-radius:8px;
    padding:10px 12px;
    margin-top:2px;
  }
  .caution-box .ev-sec-text{margin-bottom:0;}
  .check-list{
    margin:0;
    padding:0;
    list-style:none;
    font-family:inherit !important;
    font-size:13.5px !important;
    font-weight:400 !important;
    line-height:1.6 !important;
    color:inherit;
  }
  .check-item{
    display:grid;
    grid-template-columns:14px minmax(0,1fr);
    column-gap:4px;
    align-items:start;
    margin:0 0 4px 0;
    font-family:inherit !important;
    font-size:13.5px !important;
    font-weight:400 !important;
    line-height:1.6 !important;
  }
  .check-item:last-child{margin-bottom:0;}
  .check-item span{
    font-family:inherit !important;
    font-size:13.5px !important;
    font-weight:400 !important;
    line-height:1.6 !important;
  }
  .ref-box{
    margin-top:12px;
  }
  .ref-list{
    list-style:none;
    margin:0;
    padding:0;
  }
  .ref-list li{
    margin-bottom:5px;
  }
  .ref-list a{
    font-size:13px;
    color:var(--c-hist);
    text-decoration:none;
    border-bottom:1px solid currentColor;
  }
  .ref-list a:hover{opacity:.7;}
  .ref-empty{
    font-size:12.5px;
    color:var(--ink-soft);
    font-style:italic;
  }
  .close-btn{
    display:block;
    margin:16px auto 0;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:9px 20px;
    border-radius:8px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
  }
  @media (max-width:520px){
    .cat-item{grid-template-columns:76px 9px minmax(0,1fr) 16px;padding:11px 5px;}
    .cat-name{font-size:13px;}
    .cell{min-height:64px;}
    .ev-label{display:none;}
    .head h1{font-size:27px;}
  }
</style>

<style>
.cat-panel-note{
  margin-top:6px;
  font-size:12px;
  color:#6b7280;
}
</style>

<style id="vertical-event-layout">
.dots{display:flex!important;flex-direction:column!important;align-items:flex-start!important;gap:4px!important;margin-top:5px!important}.dots .dot{width:10px!important;height:10px!important;min-width:10px!important;border-radius:50%!important;display:block!important}.ev-label{display:block!important;margin-top:2px!important;font-size:11px!important;line-height:15px!important;white-space:normal!important;overflow:hidden!important;text-overflow:ellipsis!important;word-break:keep-all!important}.cell:has(.dots){cursor:pointer!important}.cell:has(.dots):hover{background:rgba(0,0,0,.025)!important}@media(max-width:720px){.dots{gap:3px!important}.dots .dot{width:8px!important;height:8px!important}.ev-label{font-size:10px!important;line-height:13px!important}}
</style>
<style id="calendar-uniform-layout">
.calendar-grid{
  grid-template-columns:repeat(7,minmax(0,1fr)) !important;
  grid-auto-rows:112px !important;
  align-items:stretch !important;
}
.day{
  min-width:0 !important;
  min-height:0 !important;
  height:112px !important;
  box-sizing:border-box !important;
  overflow:hidden !important;
  display:flex !important;
  flex-direction:column !important;
  padding:7px 6px !important;
}
.day.empty{
  height:112px !important;
}
.day-num{
  flex:0 0 auto !important;
  margin-bottom:4px !important;
  line-height:20px !important;
}
.day-events{
  flex:1 1 auto !important;
  min-height:0 !important;
  display:flex !important;
  flex-direction:column !important;
  align-items:stretch !important;
  justify-content:flex-start !important;
  gap:2px !important;
  margin-top:0 !important;
  overflow:hidden !important;
}
.event-pill{
  flex:0 0 19px !important;
  height:19px !important;
  min-height:19px !important;
  max-height:19px !important;
  box-sizing:border-box !important;
  padding:0 2px !important;
  gap:5px !important;
  overflow:hidden !important;
  line-height:19px !important;
}
.event-pill .event-dot{
  flex:0 0 9px !important;
  width:9px !important;
  height:9px !important;
  min-width:9px !important;
  max-width:9px !important;
}
.event-pill .event-name{
  display:block !important;
  flex:1 1 auto !important;
  min-width:0 !important;
  max-width:100% !important;
  overflow:hidden !important;
  text-overflow:ellipsis !important;
  white-space:nowrap !important;
  word-break:normal !important;
  overflow-wrap:normal !important;
  font-size:11px !important;
  line-height:19px !important;
  height:19px !important;
  max-height:19px !important;
}
@media (max-width:720px){
  .calendar-grid{grid-auto-rows:92px !important;}
  .day,.day.empty{height:92px !important;padding:6px 4px !important;}
  .day-num{line-height:18px !important;margin-bottom:3px !important;}
  .event-pill{
    flex-basis:17px !important;
    height:17px !important;
    min-height:17px !important;
    max-height:17px !important;
    gap:4px !important;
  }
  .event-pill .event-dot{
    width:8px !important;height:8px !important;
    min-width:8px !important;max-width:8px !important;
  }
  .event-pill .event-name{
    font-size:10px !important;
    line-height:17px !important;
    height:17px !important;
    max-height:17px !important;
  }
}
@media (max-width:520px){
  .calendar-grid{grid-auto-rows:82px !important;}
  .day,.day.empty{height:82px !important;padding:5px 3px !important;}
  .event-pill{
    flex-basis:16px !important;
    height:16px !important;
    min-height:16px !important;
    max-height:16px !important;
    gap:3px !important;
  }
  .event-pill .event-name{
    font-size:9px !important;
    line-height:16px !important;
    height:16px !important;
    max-height:16px !important;
  }
}
</style>


<style id="four-event-display-fix">
.calendar-grid, .calendar {
  min-width: 0;
}
.cell {
  min-width: 0 !important;
  box-sizing: border-box !important;
  overflow: hidden !important;
}
.dots {
  min-width: 0 !important;
  max-width: 100% !important;
  overflow: hidden !important;
}
.ev-label {
  min-width: 0 !important;
  width: 0 !important;
  display: block !important;
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
}
.more-events {
  color: #666;
}
</style>

<style id="restore-category-month-features">
.category-layout{display:grid;grid-template-columns:68px minmax(0,1fr);min-height:200px}
.side-months{display:flex;flex-direction:column;gap:3px;padding:7px 4px;background:var(--paper);border-right:1px solid var(--line)}
.side-month-btn{border:0;border-radius:7px;background:transparent;padding:11px 4px;cursor:pointer;font-family:inherit;color:var(--ink-soft)}
.side-month-btn.active{background:var(--ink);color:white;font-weight:700}
.cat-list{min-width:0;max-height:570px;overflow-y:auto;padding:6px 14px 10px}
.cat-panel-head{flex-wrap:wrap}
.cat-panel-count{margin-left:auto}
.cat-panel-note{display:none}
.chip.selected{background:#e1dfd7;border-color:#aaa69c;box-shadow:none}
@media(max-width:520px){.category-layout{grid-template-columns:56px minmax(0,1fr)}.side-months{padding:7px 4px}.cat-list{padding:5px}.cat-item{grid-template-columns:60px 8px minmax(0,1fr) 12px;gap:5px}.cat-date{font-size:11px}}
</style>
<style id="all-category-toggle-style">
.head .all-category-toggle{align-self:center;flex:0 0 auto;border:1px solid var(--line);border-radius:100px;background:var(--card);color:var(--ink);font:500 12.5px 'Noto Sans KR',sans-serif;padding:7px 13px;cursor:pointer;white-space:nowrap;}
.head .all-category-toggle:hover{border-color:var(--ink);}
.head .all-category-toggle:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
@media(max-width:520px){.head .all-category-toggle{font-size:12px;padding:6px 11px;}}
</style>
<style id="header-category-alignment-v2">
.head .category-controls{display:flex;align-items:center;gap:10px;flex:0 1 570px;min-width:0;}
.head .category-controls .legend{display:grid;grid-template-columns:repeat(3,max-content);gap:7px 8px;max-width:none;flex:1 1 auto;align-content:center;}
.head .category-controls .all-category-toggle{align-self:center;}
.head .list-visibility-control{flex:0 0 auto;align-self:center;}
@media(max-width:800px){.head .category-controls{flex:1 1 100%;flex-wrap:wrap}.head .category-controls .legend{grid-template-columns:repeat(3,max-content);}}
@media(max-width:520px){.head .category-controls .legend{grid-template-columns:repeat(2,max-content)}.head .category-controls{gap:7px}.head .chip{font-size:11px;padding:5px 7px}}
</style>
<style id="header-category-alignment-v3">
.head{display:flex;align-items:center;justify-content:space-between;flex-wrap:nowrap;gap:12px;}
.head h1{flex:0 1 390px;min-width:0;font-size:30px;}
.head .category-controls{display:flex;flex:0 1 auto;min-width:0;align-items:center;gap:8px;}
.head .category-controls .legend{display:grid;grid-template-columns:repeat(3,max-content);gap:7px 8px;max-width:none;flex:none;align-content:center;}
.head .category-controls .all-category-toggle{align-self:end;margin-left:0;}
.head .list-visibility-control{flex:0 0 auto;align-self:center;margin-left:auto;}
@media(max-width:1050px){
 .head{flex-wrap:wrap;}
 .head h1{flex:1 1 100%;font-size:34px;}
 .head .category-controls{flex:0 1 auto;}
 .head .list-visibility-control{margin-left:auto;}
}
@media(max-width:520px){
 .head h1{font-size:27px;}
 .head .category-controls{flex:1 1 100%;flex-wrap:wrap;}
 .head .category-controls .legend{grid-template-columns:repeat(2,max-content);}
 .head .list-visibility-control{margin-left:auto;}
}
</style>
<style id="category-spacing-final">
.head .category-controls{display:grid;grid-template-columns:repeat(4,max-content);column-gap:8px;row-gap:7px;align-items:center;}
.head .category-controls .legend{display:contents;}
.head .category-controls .all-category-toggle{grid-column:4;grid-row:2;align-self:center;margin:0;display:inline-flex;align-items:center;justify-content:center;min-height:0;padding:5px 10px;font-size:12.5px;font-weight:400;line-height:1.2;border-radius:100px;}
@media(max-width:520px){
 .head .category-controls{grid-template-columns:repeat(3,max-content);column-gap:6px;row-gap:7px;}
 .head .category-controls .all-category-toggle{grid-column:1 / span 2;grid-row:3;justify-self:start;}
}
</style>
<style id="category-two-row-fix">
.head .category-controls{display:grid;grid-template-columns:repeat(4,max-content);column-gap:8px;row-gap:7px;align-items:center;}
.head .category-controls .legend{display:contents;}
.head .category-controls .legend .chip:nth-child(1){grid-column:1;grid-row:1;}
.head .category-controls .legend .chip:nth-child(2){grid-column:2;grid-row:1;}
.head .category-controls .legend .chip:nth-child(3){grid-column:3;grid-row:1;}
.head .category-controls .legend .chip:nth-child(4){grid-column:1;grid-row:2;}
.head .category-controls .legend .chip:nth-child(5){grid-column:2;grid-row:2;}
.head .category-controls .legend .chip:nth-child(6){grid-column:3;grid-row:2;}
.head .category-controls .all-category-toggle{grid-column:4;grid-row:2;}

는 법적 지위 확인\n· 성별에 따른 외모·직업·가사·육아 역할 고정관념 주의\n· 여성의 날을 단순 ‘여성 고객 할인’로 축소하지 않기\n· 성적 대상화·외모 평가 중심 비주얼 지양\n· 기업의 실제 성평등 정책과 메시지의 정합성 확인\n· 통계·임금격차 수치는 기준연도와 출처 표시\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"UN 공식 페이지 - International Women's Day","url":"https://www.un.org/en/observances/womens-day"}]},{"cat":"cat6","title":"3·8민주의거 기념일","desc":"3·8민주의거 기념일은 대한민국의 민주주의·독립·항쟁 또는 역사적 희생을 기리는 국가기념일·역사 일정입니다. 사건의 역사적 맥락과 희생자를 존중하는 표현이 필요합니다.","caution":"3·8민주의거 기념일과 관련된 희생자·시위·진압·독립운동 장면을 유머·밈·판매 촉진 소재로 사용하지 않습니다. 날짜·숫자와 할인율을 결합할 때 역사적 사건을 희화화하는 중의성이 없는지 확인하고, 특정 정치세력의 현재적 지지·반대로 오인될 표현도 검수합니다.","note":"· ‘3·8민주의거 기념일’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 희생자·유가족·참여자의 사진·사연을 구매유도에 이용하지 않기\n· 폭력·진압·총기·포격 장면을 유머·밈으로 소비하지 않기\n· 사건 날짜·숫자를 할인율·쿠폰명과 결합할 때 의미 검토\n· 현재 정치세력 지지·반대로 오인될 표현 주의\n· 역사적 명칭·연도·사실관계는 공신력 있는 자료로 확인\n· AI 생성 역사 이미지의 시대·복식·상징 오류 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]}],"03-14":[{"cat":"cat1","title":"화이트데이","desc":"화이트데이은 대중문화·상업 프로모션과 밀접하게 활용되는 시즌성 일정입니다. 유머·관계·선물·할인 메시지를 사용할 때 소비자 오인, 차별적 고정관념, 과도한 구매 압박을 피하는 것이 중요합니다.","caution":"화이트데이 프로모션에서 연애·결혼 여부를 정상/비정상으로 나누거나 특정 성별이 선물을 해야 한다는 고정관념을 강화하지 않습니다. 초콜릿·과자 등 식품의 가격·구성·알레르기 정보를 정확히 표시하고, ‘고백 성공 보장’처럼 관계 결과를 단정하는 과장 카피도 피합니다.","note":"· ‘화이트데이’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"위키백과 - 화이트데이","url":"https://ko.wikipedia.org/wiki/화이트데이"}]}],"03-15":[{"cat":"cat6","title":"3·15의거 기념일","desc":"3·15의거 기념일은 대한민국의 민주주의·독립·항쟁 또는 역사적 희생을 기리는 국가기념일·역사 일정입니다. 사건의 역사적 맥락과 희생자를 존중하는 표현이 필요합니다.","caution":"3·15의거 기념일과 관련된 희생자·시위·진압·독립운동 장면을 유머·밈·판매 촉진 소재로 사용하지 않습니다. 날짜·숫자와 할인율을 결합할 때 역사적 사건을 희화화하는 중의성이 없는지 확인하고, 특정 정치세력의 현재적 지지·반대로 오인될 표현도 검수합니다.","note":"· ‘3· 차별 철폐의 날","desc":"세계 인종차별 철폐의 날은 차별·폭력·불평등을 줄이고 인권·평화·민주적 가치를 확산하기 위한 기념일입니다. 특정 집단이나 국가를 단순화하지 않는 균형 있는 표현이 필요합니다.","caution":"세계 인종차별 철폐의 날의 공식 취지와 사회적 맥락을 먼저 확인한 뒤, 기념일 명칭을 단순한 할인 명분으로 소비하지 않도록 합니다. 관련 인물·집단·상징을 희화화하거나 ‘공식·인증·후원’으로 오인시키는 표현을 피하고, 사실·통계·이미지·AI 생성물의 정확성과 권리관계를 게시 전에 함께 검수합니다.","note":"· ‘세계 인종차별 철폐의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"UN - International Days and Weeks","url":"https://www.un.org/en/observances/list-days-weeks"}]},{"cat":"cat2","title":"춘분 (24절기)","desc":"낮과 밤의 길이가 비슷해지는 봄의 절기 2027년 해당 날짜는 3월 21일이며, 태양의 위치에 따른 절기로 이해해야 함. 법정공휴일과는 별개임.","caution":"낮밤 길이가 정확히 동일하다는 단정은 피하기. 또한 계절·전통문화와 관련한 표현은 소비자 오인 가능성을 사전 검토하고, 할인율·기간·수량·가격 조건을 명확히 표시해야 함. 상품의 효능·원산지·인증 여부는 객관적 근거에 따라 확인할 것.","note":"봄철 균형 식단·야외활동 제안. 실제 판매 시점의 기상·상품 수급·문화적 맥락을 고려하여 캠페인 집행. 날짜 출처는 2027년 절기/음양력 달력과 대조 권장.","links":[{"label":"한국천문연구원","url":"https://www.kasi.re.kr/"}]}],"03-22":[{"cat":"cat5","title":"UN 세계 물의 날","desc":"UN 세계 물의 날은 환경보전과 지속가능성, 생태계 보호에 대한 인식을 높이기 위한 날입니다. 환경적 효익을 주장할 때는 구체적인 범위와 객관적 근거가 중요합니다.","caution":"UN 세계 물의 날과 연계해 ‘친환경·에코·그린·탄소중립·무공해’ 등을 사용할 경우 세계 물의 날과 실제 상품·사업의 관련성 및 객관적 근거를 확인합니다. 일부 친환경 요소를 제품 전체나 기업 전체의 성과로 확대하거나 자연 이미지·녹색 색상만으로 환경 우수성을 암시하는 그린워싱을 주의합니다.","note":"· ‘UN 세계 물의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· ‘친환경·탄소중립·무공해’ 등 표현의 객관적 근거 확보\n· 일부 친환경 요소를 제품·기업 전체 성과로 확대하지 않기\n· 환경표지·인증마크 사용 자격과 유효범위 확인\n· 재활용·생분해·감축량 등 수치는 조건·산정기준 표시\n· 자연·녹색 이미지만으로 환경 우수성을 암시하지 않기\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"위키백과(영문) - World Water Day","url":"https://en.wikipedia.org/wiki/World_Water_Day"}]}],"03-24":[{"cat":"cat5","title":"세계 결핵의 날","desc":"세계 결핵의 날은 건강·보건·예방 또는 환자·당사자 보호의 중요성을 알리는 날입니다. 의학적 사실과 상품 광고를 구분하고, 불안·공포를 과도하게 자극하지 않는 커뮤니케이션이 필요합니다.","caution":"세계 결핵의 날 관련 캠페인에서 질병 예방·치료·완치를 상품 효능으로 단정하거나 의학적 근거가 부족한 건강정보를 구매유도와 결합하지 않습니다. 환자·감염인을 공포·혐오·책임의 대상으로 묘사하지 않고, 통계·검진·예방정보는 공신력 있는 출처로 확인합니다.","note":"· ‘세계 결핵의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"WHO - Global health days and campaigns","url":"https://www.who.int/campaigns"}]}],"03-26":[{"cat":"cat5","title":"천안함 피격 사건일","desc":"천안함 피격 사건일은 군사적 충돌·전쟁·정치적 격변과 관련된 대한민국 현대사의 역사 일정입니다. 희생자와 관련 당사자를 존중하고 폭력·전쟁을 희화화하지 않아야 합니다.","caution":"천안함 피격 사건일 관련 콘텐츠에서는 전쟁·포격·총기·폭발·군사충돌을 게임·유머·세일 카피로 가볍게 소비하지 않습니다. 희생자·군인·유가족을 상업적으로 이용하거나 특정 국가·민족 전체에 대한 혐오로 확장하지 않도록 하고, 역사적 사실과 용어도 정확히 확인합니다.","note":"· ‘천안함 피격 사건일’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 희생자·유가족·참여자의 사진·사연을 구매유도에 이용하지 않기\n· 폭력·진압·총기·포격 장면을 유머·밈으로 소비하지 않기\n· 사건 날짜·숫자를 할인율·쿠폰명과 결합할 때 의미 검토\n· 현재 정치세력 지지·반대로 오인될 표현 주의\n· 역사적 명칭·연도·사실관계는 공신력 있는 자료로 확인\n· AI 생성 역사 이미지의 시대·복식·상징 오류 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]}],"04-01":[{"cat":"cat2","title":"만우절","desc":"만우절은 대중문화·상업 프로모션과 밀접하게 활용되는 시즌성 일정입니다. 유머·관계·선물·할인 메시지를 사용할 때 소비자 오인, 차별적 고정관념, 과도한 구매 압박을 피하는 것이 중요합니다.","caution":"만우절 유머는 소비자가 실제 상품·가격·서비스·회사 공지로 오인할 수 있는 허위정보를 만들지 않도록 해야 합니다. 재난·사망·질병·해고·개인정보 유출 등 민감한 주제의 거짓말, 경쟁사 비방, 실제 결제·예약을 유도하는 낚시성 이벤트는 지양합니다.","note":"· ‘만우절’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"위키백과 - 만우절","url":"https://ko.wikipedia.org/wiki/만우절"}]}],"04-02":[{"cat":"cat3","title":"세계 자폐인의 날","desc":"세계 자폐인의 날은 장애인의 권리·사회참여·접근성과 차별 해소의 중요성을 알리는 날입니다. 장애를 동정이나 극복 서사로만 다루지 않고 당사자의 존엄과 선택권을 존중해야 합니다.","caution":"세계 자폐인의 날 관련 광고에서는 장애인을 ‘불쌍함’, ‘극복의 기적’, ‘영웅’이라는 단일 서사로 소비하지 않습니다. 장애를 비유적 부정어로 쓰거나 비장애인 관점의 체험 이벤트로 단순화하지 말고, 접근성·자막·대체텍스트 등 실제 이용 환경도 함께 점검합니다.","note":"· ‘세계 자폐인의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 장애를 ‘극복해야 할 비극’ 또는 감동 소재로만 표현하지 않기\n· 장애 관련 비하어·관용표현 사용 여부 검수\n· 당사자 이미지·사례 사용 시 존엄·초상권·동의 고려\n· 웹·영상·오프라인 행사 접근성 실제 제공 여부 확인\n· 비장애인 체험을 장애인의 삶 전체로 일반화하지 않기\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"UN - International Days and Weeks","url":"https://www.un.org/en/observances/list-days-weeks"}]}],"04-03":[{"cat":"cat6","title":"4·3희생자 추념일","desc":"4·3희생자 추념일은 해당 주제의 사회적 의미와 인식을 높이기 위해 기념하거나 활용되는 일정입니다. 공식 명칭·취지·주관기관 및 최신 사실관계를 확인하고 본래 의미에 맞게 커뮤니케이션해야 합니다.","caution":"4·3희생자 추념일의 공식 취지와 사회적 맥락을 먼저 확인한 뒤, 기념일 명칭을 단순한 할인 명분으로 소비하지 않도록 합니다. 관련 인물·집단·상징을 희화화하거나 ‘공식·인증·후원’으로 오인시키는 표현을 피하고, 사실·통계·이미지·AI 생성물의 정확성과 권리관계를 게시 전에 함께 검수합니다.","note":"· ‘4·3희생자 추념일’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]}],"04-05":[{"cat":"cat5","title":"식목일","desc":"식목일은 해당 주제의 사회적 의미와 인식을 높이기 위해 기념하거나 활용되는 일정입니다. 공식 명칭·취지·주관기관 및 최신 사실관계를 확인하고 본래 의미에 맞게 커뮤니케이션해야 합니다.","caution":"식목일의 공식 취지와 사회적 맥락을 먼저 확인한 뒤, 기념일 명칭을 단순한 할인 명분으로 소비하지 않도록 합니다. 관련 인물·집단·상징을 희화화하거나 ‘공식·인증·후원’으로 오인시키는 표현을 피하고, 사실·통계·이미지·AI 생성물의 정확성과 권리관계를 게시 전에 함께 검수합니다.","note":"· ‘식목일’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]},{"cat":"cat2","title":"청명 (24절기)","desc":"하늘이 맑아지고 봄 농사가 시작되는 무렵 2027년 해당 날짜는 4월 5일이며, 태양의 위치에 따른 절기로 이해해야 함. 법정공휴일과는 별개임.","caution":"맑은 날씨 보장이나 미세먼지 개선 효과 암시 금지. 또한 계절·전통문화와 관련한 표현은 소비자 오인 가능성을 사전 검토하고, 할인율·기간·수량·가격 조건을 명확히 표시해야 함. 상품의 효능·원산지·인증 여부는 객관적 근거에 따라 확인할 것.","note":"식목·가드닝·봄 산책 테마. 실제 판매 시점의 기상·상품 수급·문화적 맥락을 고려하여 캠페인 집행. 날짜 출처는 2027년 절기/음양력 달력과 대조 권장.","links":[{"label":"한국천문연구원","url":"https://www.kasi.re.kr/"}]}],"04-07":[{"cat":"cat5","title":"세계 보건의 날","desc":"세계 보건의 날은 건강·보건·예방 또는 환자·당사자 보호의 중요성을 알리는 날입니다. 의학적 사실과 상품 광고를 구분하고, 불안·공포를 과도하게 자극하지 않는 커뮤니케이션이 필요합니다.","caution":"세계 보건의 날 관련 캠페인에서 질병 예방·치료·완치를 상품 효능으로 단정하거나 의학적 근거가 부족한 건강정보를 구매유도와 결합하지 않습니다. 환자·감염인을 공포·혐오·책임의 대상으로 묘사하지 않고, 통계·검진·예방정보는 공신력 있는 출처로 확인합니다.","note":"· ‘세계 보건의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"WHO - Global health days and campaigns","url":"https://www.who.int/campaigns"}]}],"04-11":[{"cat":"cat6","title":"대한민국 임시정부수립 기념일","desc":"대한민국 임시정부수립 기념일은 대한민국의 민주주의·독립·항쟁 또는 역사적 희생을 기리는 국가기념일·역사 일정입니다. 사건의 역사적 맥락과 희생자를 존중하는 표현이 필요합니다.","caution":"대한민국 임시정부수립 기념일과 관련된 희생자·시위·진압·독립운동 장면을 유머·밈·판매 촉진 소재로 사용하지 않습니다. 날짜·숫자와 할인율을 결합할 때 역사적 사건을 희화화하는 중의성이 없는지 확인하고, 특정 정치세력의 현재적 지지·반대로 오인될 표현도 검수합니다.","note":"· ‘대한민국 임시정부수립 기념일’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 희생자·유가족·참여자의 사진·사연을 구매유도에 이용하지 않기\n· 폭력·진압·총기·포격 장면을 유머·밈으로 소비하지 않기\n· 사건 날짜·숫자를 할인율·쿠폰명과 결합할 때 의미 검토\n· 현재 정치세력 지지·반대로 오인될 표현 주의\n· 역사적 명칭·연도·사실관계는 공신력 있는 자료로 확인\n· AI 생성 역사 이미지의 시대·복식·상징 오류 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]}],"04-14":[{"cat":"cat1","title":"블랙데이","desc":"블랙데이은 대중문화·상업 프로모션과 밀접하게 활용되는 시즌성 일정입니다. 유머·관계·선물·할인 메시지를 사용할 때 소비자 오인, 차별적 고정관념, 과도한 구매 압박을 피하는 것이 중요합니다.","caution":"블랙데이 프로모션에서 연애·결혼 여부를 정상/비정상으로 나누거나 특정 성 \n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]}],"04-28":[{"cat":"cat6","title":"충무공 이순신 탄신일","desc":"충무공 이순신 탄신일은 해당 주제의 사회적 의미와 인식을 높이기 위해 기념하거나 활용되는 일정입니다. 공식 명칭·취지·주관기관 및 최신 사실관계를 확인하고 본래 의미에 맞게 커뮤니케이션해야 합니다.","caution":"충무공 이순신 탄신일의 공식 취지와 사회적 맥락을 먼저 확인한 뒤, 기념일 명칭을 단순한 할인 명분으로 소비하지 않도록 합니다. 관련 인물·집단·상징을 희화화하거나 ‘공식·인증·후원’으로 오인시키는 표현을 피하고, 사실·통계·이미지·AI 생성물의 정확성과 권리관계를 게시 전에 함께 검수합니다.","note":"· ‘충무공 이순신 탄신일’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]},{"cat":"cat5","title":"산업재해근로자의 날","desc":"산업재해근로자의 날은 노동·산업·직업 또는 해당 산업 분야의 사회적 기여와 안전·권익을 돌아보는 기념일입니다. 종사자를 단순한 홍보 소재로 소비하지 않고 실제 근로환경·안전과 일치하는 메시지가 필요합니다.","caution":"산업재해근로자의 날 관련 메시지에서 노동자의 희생·장시간 노동을 ‘열정’이나 유머로 미화하지 않습니다. 기업의 실제 근로조건·안전정책과 동떨어진 감사·안전 캠페인은 진정성 논란이 생길 수 있으며, 산재 장면을 자극적으로 재현하지 않도록 합니다.","note":"· ‘산업재해근로자의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"ILO - International Labour Organization","url":"https://www.ilo.org/"}]},{"cat":"cat5","title":"세계 산업안전보건의 날","desc":"세계 산업안전보건의 날은 건강·보건·예방 또는 환자·당사자 보호의 중요성을 알리는 날입니다. 의학적 사실과 상품 광고를 구분하고, 불안·공포를 과도하게 자극하지 않는 커뮤니케이션이 필요합니다.","caution":"세계 산업안전보건의 날 관련 캠페인에서 질병 예방·치료·완치를 상품 효능으로 단정하거나 의학적 근거가 부족한 건강정보를 구매유도와 결합하지 않습니다. 환자·감염인을 공포·혐오·책임의 대상으로 묘사하지 않고, 통계·검진·예방정보는 공신력 있는 출처로 확인합니다.","note":"· ‘세계 산업안전보건의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"WHO - Global health days and campaigns","url":"https://www.who.int/campaigns"}]}],"05-01":[{"cat":"cat3","title":"노동절(근로자의 날)","desc":"노동절(근로자의 날)은 노동·산업·직업 또는 해당 산업 분야의 사회적 기여와 안전·권익을 돌아보는 기념일입니다. 종사자를 단순한 홍보 소재로 소비하지 않고 실제 근로환경·안전과 일치하는 메시지가 필요합니다.","caution":"노동절(근로자의 날) 관련 메시지에서 노동자의 희생·장시간 노동을 ‘열정’이나 유머로 미화하지 않습니다. 기업의 실제 근로조건·안전정책과 동떨어진 감사·안전 캠페인은 진정성 논란이 생길 수 있으며, 산재 장면을 자극적으로 재현하지 않도록 합니다.","note":"· ‘노동절(근로자의 날)’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"ILO - International Labour Organization","url":"https://www.ilo.org/"}]}],"05-03":[{"cat":"cat3","title":"세계 언론자유의 날","desc":"세계 언론자유의 날은 지식·문화·미디어·표현의 자유 또는 창작자 권리와 관련된 기념일입니다. 콘텐츠를 활용할 때 저작권·상표권·초상권과 출처 표기를 특히 점검해야 합니다.","caution":"세계 언론자유의 날 관련 콘텐츠에서는 언론·방송의 공익적 의미를 특정 매체나 기자에 대한 조롱·비방과 결합하지 않습니다. 기사·방송화면·신문 지면·사진을 광고 소재로 재사용할 경우 저작권·초상권·인용 요건과 광고성 오인 가능성을 확인합니다.","note":"· ‘세계 언론자유의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"UN - International Days and Weeks","url":"https://www.un.org/en/observances/list-days-weeks"}]}],"05-05":[{"cat":"cat2","title":"어린이날","desc":"어린이날은 2027년 국내 공휴일·명절·국경일 또는 그 연휴와 관련된 일정입니다. 공식 명칭과 공휴일·대체공휴일 적용 여부, 역사·문화적 의미를 정확히 반영해야 합니다.","caution":"어린이날 관련 프로모션은 공식 명칭·날짜·대체공휴일 여부와 배송·휴무 정보를 정확히 표시해야 합니다. 국가·종교·역사적 상징을 할인·경품과 자극적으로 결합하거나 기념일의 의미를 희화화하지 않는지 검토합니다.","note":"· ‘어린이날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 2027년 공휴일·대체공휴일 적용일 정확히 표시\n· 배송마감·휴무·영업시간 등 고객 안내정보 정확성 확인\n· 국가·전통·종교 상징의 훼손·부적절한 변형 주의\n· 선물세트·행사상품 가격·구성·수량 조건 명확히 표시\n· 날짜·숫자와 할인율 결합 시 역사적·문화적 중의성 검토\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"국가법령정보센터 - 공휴일에 관한 법률","url":"https://www.law.go.kr/법령/공휴일에관한법률"}]}],"05-10":[{"cat":"cat6","title":"유권자의 날","desc":"유권자의 날은 선거·유권자 참여 또는 법정 선거 일정과 관련된 날입니다. 기업 메시지가 특정 후보·정당의 지지·반대로 오인되지 않도록 정치적 중립성과 관련 법규를 고려해야 합니다.","caution":"유권자의 날 전후에는 후보자·정당명·기호·상징색·구호·사진을 연상시키는 상업 표현이 특정 정치적 지지로 오인되지 않도록 합니다. 투표 인증과 할인·경품을 대가관계처럼 연결하지 말고, 투표일·시간·대상 등 안내정보는 선거관리기관의 최신 정보를 기준으로 합니다.","note":"· ‘유권자의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]}],"05-11":[{"cat":"cat6","title":"동학농민혁명 기념일","desc":"동학농민혁명 기념일은 대한민국의 민주주의·독립·항쟁 또는 역사적 희생을 기리는 국가기념일·역사 일정입니다. 사건의 역사적 맥락과 희생자를 존중하는 표현이 필요합니다.","caution":"동학농민혁명 기념일과 관련된 희생자·시위·진압·독립운동 장면을 유머·밈·판매 촉진 소재로 사용하지 않습니다. 날짜·숫자와 할인율을 결합할 때 역사적 사건을 희화화하는 중의성이 없는지 확인하고, 특정 정치세력의 현재적 지지·반대로 오인될 표현도 검수합니다.","note":"· ‘동학농민혁명 기념일’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 희생자·유가족·참여자의 사진·사연을 구매유도에 이용하지 않기\n· 폭력·진압·총기·포격 장면을 유머·밈으로 소비하지 않기\n· 사건 날짜·숫자를 할인율·쿠폰명과 결합할 때 의미 검토\n· 현재 정치세력 지지·반대로 오인될 표현 주의\n· 역사적 명칭·연도·사실관계는 공신력 있는 자료로 확인\n· AI 생성 역사 이미지의 시대·복식·상징 오류 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]}],"05-14":[{"cat":"cat5","title":"식품안전의 날","desc":"식품안전의 날은 식품의 안전한 유통·소비와 정확한 표시·원산지 정보 제공에 직접 연결되는 주제입니다. 소비자가 제품의 성격·원재료·원산지·안전성을 오인하지 않도록 하는 것이 핵심입니다.","caution":"식품안전의 날 관련 마케팅은 제품명·원재료·함량·알레르기·원산지·보관방법·유통/소비기한 등 법정 표시와 광고 표현이 서로 모순되지 않는지 우선 확인해야 합니다. ‘국내산·지역명·무첨가·안전·프리미엄’ 등의 표현이 실제 근거 범위를 넘어 소 인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"UN - International Days and Weeks","url":"https://www.un.org/en/observances/list-days-weeks"}]},{"cat":"cat3","title":"지체장애인의 날","desc":"지체장애인의 날은 장애인의 권리·사회참여·접근성과 차별 해소의 중요성을 알리는 날입니다. 장애를 동정이나 극복 서사로만 다루지 않고 당사자의 존엄과 선택권을 존중해야 합니다.","caution":"지체장애인의 날 관련 광고에서는 장애인을 ‘불쌍함’, ‘극복의 기적’, ‘영웅’이라는 단일 서사로 소비하지 않습니다. 장애를 비유적 부정어로 쓰거나 비장애인 관점의 체험 이벤트로 단순화하지 말고, 접근성·자막·대체텍스트 등 실제 이용 환경도 함께 점검합니다.","note":"· ‘지체장애인의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 장애를 ‘극복해야 할 비극’ 또는 감동 소재로만 표현하지 않기\n· 장애 관련 비하어·관용표현 사용 여부 검수\n· 당사자 이미지·사례 사용 시 존엄·초상권·동의 고려\n· 웹·영상·오프라인 행사 접근성 실제 제공 여부 확인\n· 비장애인 체험을 장애인의 삶 전체로 일반화하지 않기\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]},{"cat":"cat1","title":"농업인의 날","desc":"농업인의 날은 노동·산업·직업 또는 해당 산업 분야의 사회적 기여와 안전·권익을 돌아보는 기념일입니다. 종사자를 단순한 홍보 소재로 소비하지 않고 실제 근로환경·안전과 일치하는 메시지가 필요합니다.","caution":"농업인의 날의 공식 취지와 사회적 맥락을 먼저 확인한 뒤, 기념일 명칭을 단순한 할인 명분으로 소비하지 않도록 합니다. 관련 인물·집단·상징을 희화화하거나 ‘공식·인증·후원’으로 오인시키는 표현을 피하고, 사실·통계·이미지·AI 생성물의 정확성과 권리관계를 게시 전에 함께 검수합니다.","note":"· ‘농업인의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"농림축산식품부 - 정책·보도자료","url":"https://www.mafra.go.kr/"}]}],"11-14":[{"cat":"cat5","title":"세계 당뇨병의 날","desc":"세계 당뇨병의 날은 건강·보건·예방 또는 환자·당사자 보호의 중요성을 알리는 날입니다. 의학적 사실과 상품 광고를 구분하고, 불안·공포를 과도하게 자극하지 않는 커뮤니케이션이 필요합니다.","caution":"세계 당뇨병의 날 관련 캠페인에서 질병 예방·치료·완치를 상품 효능으로 단정하거나 의학적 근거가 부족한 건강정보를 구매유도와 결합하지 않습니다. 환자·감염인을 공포·혐오·책임의 대상으로 묘사하지 않고, 통계·검진·예방정보는 공신력 있는 출처로 확인합니다.","note":"· ‘세계 당뇨병의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"WHO - Global health days and campaigns","url":"https://www.who.int/campaigns"}]}],"11-17":[{"cat":"cat6","title":"순국선열의 날","desc":"순국선열의 날은 대한민국의 민주주의·독립·항쟁 또는 역사적 희생을 기리는 국가기념일·역사 일정입니다. 사건의 역사적 맥락과 희생자를 존중하는 표현이 필요합니다.","caution":"순국선열의 날과 관련된 희생자·시위·진압·독립운동 장면을 유머·밈·판매 촉진 소재로 사용하지 않습니다. 날짜·숫자와 할인율을 결합할 때 역사적 사건을 희화화하는 중의성이 없는지 확인하고, 특정 정치세력의 현재적 지지·반대로 오인될 표현도 검수합니다.","note":"· ‘순국선열의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 희생자·유가족·참여자의 사진·사연을 구매유도에 이용하지 않기\n· 폭력·진압·총기·포격 장면을 유머·밈으로 소비하지 않기\n· 사건 날짜·숫자를 할인율·쿠폰명과 결합할 때 의미 검토\n· 현재 정치세력 지지·반대로 오인될 표현 주의\n· 역사적 명칭·연도·사실관계는 공신력 있는 자료로 확인\n· AI 생성 역사 이미지의 시대·복식·상징 오류 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]}],"11-18":[{"cat":"cat1","title":"대학수학능력시험(수능)일","desc":"대학수학능력시험(수능)일은 해당 주제의 사회적 의미와 인식을 높이기 위해 기념하거나 활용되는 일정입니다. 공식 명칭·취지·주관기관 및 최신 사실관계를 확인하고 본래 의미에 맞게 커뮤니케이션해야 합니다.","caution":"대학수학능력시험(수능)일의 공식 취지와 사회적 맥락을 먼저 확인한 뒤, 기념일 명칭을 단순한 할인 명분으로 소비하지 않도록 합니다. 관련 인물·집단·상징을 희화화하거나 ‘공식·인증·후원’으로 오인시키는 표현을 피하고, 사실·통계·이미지·AI 생성물의 정확성과 권리관계를 게시 전에 함께 검수합니다.","note":"· ‘대학수학능력시험(수능)일’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"한국교육과정평가원 - 대학수학능력시험","url":"https://www.suneung.re.kr/"}]}],"11-19":[{"cat":"cat3","title":"아동학대 예방의 날","desc":"아동학대 예방의 날은 건강·보건·예방 또는 환자·당사자 보호의 중요성을 알리는 날입니다. 의학적 사실과 상품 광고를 구분하고, 불안·공포를 과도하게 자극하지 않는 커뮤니케이션이 필요합니다.","caution":"아동학대 예방의 날은 폭력 피해자를 다루는 날이므로 학대 장면을 충격적으로 재현하거나 피해자의 얼굴·신상·사연을 구매유도에 활용하지 않습니다. 신고·예방·지원정보를 정확히 제공하고, 피해자에게 책임을 돌리는 표현을 금지합니다.","note":"· ‘아동학대 예방의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]}],"11-20":[{"cat":"cat3","title":"세계 어린이의 날","desc":"세계 어린이의 날은 가족·아동·부모 또는 생애주기와 관련된 사회적 의미를 되새기는 날입니다. 다양한 가족 형태와 개인의 상황을 배제하지 않는 포용적 표현이 중요합니다.","caution":"세계 어린이의 날의 공식 취지와 사회적 맥락을 먼저 확인한 뒤, 기념일 명칭을 단순한 할인 명분으로 소비하지 않도록 합니다. 관련 인물·집단·상징을 희화화하거나 ‘공식·인증·후원’으로 오인시키는 표현을 피하고, 사실·통계·이미지·AI 생성물의 정확성과 권리관계를 게시 전에 함께 검수합니다.","note":"· ‘세계 어린이의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"UN - International Days and Weeks","url":"https://www.un.org/en/observances/list-days-weeks"}]}],"11-22":[{"cat":"cat1","title":"김치의 날","desc":"김치의 날은 특정 식품·농축수산물의 소비 촉진 또는 인지도 제고와 연결되는 기념일입니다. 상품 홍보 시 원산지·품종·함량·인증·가격 등 소비자 선택에 영향을 주는 정보의 정확성이 중요합니다.","caution":"김치의 날 프로모션에서는 행사 대상 상품이 해당 원재료·축종·품종·원산지 조건을 실제 충족하는지 확인합니다. 대표 이미지가 실제 구성·중량을 과장하지 않도록 하고, ‘국산·한우·유기농·무농약·지역특산’ 등 인증·원산지 표현은 증빙 범위와 일치시켜야 합니다.","note":"· ‘김치의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 제품명·원재료·함량·원산지와 광고문구 일치 확인\n· ‘국내산·지역명·유기농·무첨가’ 등 표현의 증빙 범위 확인\n· 질병 예방·치료 효과로 오인될 효능 표현 지양\n· 할인율·정상가·행사기간·수량 조건 명확히 표시\n· 조리·연출 이미지가 실제 구성·중량을 과장하지 않는지 확인\n· 알레르기·보관·섭취 관련 필수정보 누락 여부 확인\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"농림축산식품부 - 정책·보도자료","url":"https://www.mafra.go.kr/"}]},{"cat":"cat2","title":"소설 (24절기)","desc":"첫눈이 내릴 수 있다는 작은 눈의 절기 2027년 해당 날짜는 11월 22일이며, 태양의 위치에 따른 절기로 이해해야 함. 법정공휴일과는 별개임.","caution":"실제 첫눈 예보로 오인될 문구 및 눈길 안전 경시 금지. 또한 계절·전통문화와 관련한 표현은 소비자 오인 가능성을 사전 검토하고, 할인율·기간·수량·가격 조건을 명확히 표시해야 함. 상품의 효능·원산지·인증 여부는 객관적 근거에 따라 확인할 것.","note":"겨울 신발·방수용품·차량 안전. 실제 판매 시점의 기상·상품 수급·문화적 맥락을 고려하여 캠페인 집행. 날짜 출처는 2027년 절기/음양력 달력과 대조 권장.","links":[{"label":"한국천문연구원","url":"https://www.kasi.re.kr/"}]}],"11-23":[{"cat":"cat5","title":"연평도 포격 사건일","desc":"연평도 포격 사건일은 군사적 충돌·전쟁·정치적 격변과 관련된 대한민국 현대사의 역사 일정입니다. 희생자와 관련 당사자를 존중하고 폭력·전쟁을 희화화하지 않아야 합니다.","caution":"연평도 포격 사건일 관련 콘텐츠에서는 전쟁·포격·총기·폭발·군사충돌을 게임·유머·세일 카피로 가볍게 소비하지 않습니다. 희생자·군인·유가족을 상업적으로 이용하거나 특정 국가·민족 전체에 대한 혐오로 확장하지 않도록 하고, 역사적 사실과 용어도 정확히 확인합니다.","note":"· ‘연평도 포격 사건일’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 희생자·유가족·참여자의 사진·사연을 구매유도에 이용하지 않기\n· 폭력·진압·총기·포격 장면을 유머·밈으로 소비하지 않기\n· 사건 날짜·숫자를 할인율·쿠폰명과 결합할 때 의미 검토\n· 현재 정치세력 지지·반대로 오인될 표현 주의\n· 역사적 명칭·연도·사실관계는 공신력 있는 자료로 확인\n· AI 생성 역사 이미지의 시대·복식·상징 오류 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]}],"11-25":[{"cat":"cat3","title":"세계 여성폭력 추방의 날","desc":"세계 여성폭력 추방의 날은 여성·여아의 권리와 평등, 차별·폭력 해소 또는 해당 분야에서의 참여 확대를 알리는 날입니다. 성별 고정관념을 재생산하지 않는 표현이 중요합니다.","caution":"세계 여성폭력 추방의 날은 폭력 피해와 인권침해를 다루는 날이므로 신체 훼손·폭행 장면을 선정적으로 재현하거나 피해자를 무력한 이미지로 소비하지 않습니다. 특정 문화·국가·종교 전체를 폭력과 동일시하는 표현도 피하고, 상품 판매보다 예방·지원 정보가 중심이 되도록 합니다.","note":"· ‘세계 여성폭력 추방의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 성별에 따른 외모·직업·가사·육아 역할 고정관념 주의\n· 여성의 날을 단순 ‘여성 고객 할인’로 축소하지 않기\n· 성적 대상화·외모 평가 중심 비주얼 지양\n· 기업의 실제 성평등 정책과 메시지의 정합성 확인\n· 통계·임금격차 수치는 기준연도와 출처 표시\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"UN - International Days and Weeks","url":"https://www.un.org/en/observances/list-days-weeks"}]}],"11-26":[{"cat":"cat1","title":"블랙프라이데이","desc":"블랙프라이데이은 대중문화·상업 프로모션과 밀접하게 활용되는 시즌성 일정입니다. 유머·관계·선물·할인 메시지를 사용할 때 소비자 오인, 차별적 고정관념, 과도한 구매 압박을 피하는 것이 중요합니다.","caution":"블랙프라이데이 할인에서는 정상가를 인위적으로 높인 뒤 큰 할인율처럼 표시하거나 ‘최저가·역대급’ 등을 근거 없이 사용하는 행위를 주의합니다. 행사기간·대상상품·수량·쿠폰 중복조건·배송조건을 명확히 표시하고 해외 행사와의 공식 연계로 오인시키지 않도록 합니다.","note":"· ‘블랙프라이데이’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표 const YEAR = 2027;
const MONTH_NAMES = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
const WD = ["일","월","화","수","목","금","토"];
const TODAY = new Date(); // 접속한 컴퓨터의 현재 날짜

let activeMonth = TODAY.getFullYear() <= YEAR ? TODAY.getMonth() + 1 : 1;
let activeCats = new Set(Object.keys(CATS));
  let selectedCats = new Set();
let selectedMonths = new Set();
let calendarCategoryFilterEnabled = false;
let categoryPanelVisible = false;

function pad(n){ return n<10 ? "0"+n : ""+n; }


// ===== 사용자 제공 기념일 표 추가 데이터 =====
// 동일한 (카테고리+날짜+기념일명)은 1회만 추가되며,
// 날짜가 같아도 기념일명이 다르면 각각 별도 이벤트로 표시됩니다.
const USER_ADDED_EVENTS = [];
function mergeUserAddedEvents(){
  USER_ADDED_EVENTS.forEach(item => {
    if(!EVENTS[item.date]) EVENTS[item.date] = [];

    // 동일 기념일(같은 카테고리·날짜·명칭)은 중복 추가하지 않음
    const duplicated = EVENTS[item.date].some(e =>
      e.cat === item.cat && e.title === item.title
    );
    if(!duplicated){
      EVENTS[item.date].push({
        cat:item.cat,
        title:item.title,
        desc:item.desc,
        caution:item.caution
      });
    }
  });
}

mergeUserAddedEvents();


function updateAllCategoryToggle(){
  const button=document.getElementById("allCategoryToggle");
  if(!button)return;
  const allSelected=selectedCats.size===Object.keys(CATS).length;
  button.textContent=allSelected?"전체해제":"전체선택";
  button.setAttribute("aria-pressed",String(allSelected));
}
function toggleAllCategories(){
  const allSelected=selectedCats.size===Object.keys(CATS).length;
  selectedCats=allSelected?new Set():new Set(Object.keys(CATS));
  selectedMonths.clear(); // 전체선택 시 1~12월 모두 표시
  calendarCategoryFilterEnabled=true;
  renderLegend();renderMonthNav();showCategoryPanel();renderCalendar();
}
document.getElementById("allCategoryToggle").addEventListener("click",toggleAllCategories);
document.getElementById("listVisibilityToggle").addEventListener("click",()=>{
  const opening=!categoryPanelVisible;
  categoryPanelVisible=opening;
  if(opening){
    selectedCats=new Set(Object.keys(CATS));
    selectedMonths.clear();
    calendarCategoryFilterEnabled=true;
    renderLegend();renderMonthNav();renderCalendar();
  }
  showCategoryPanel();
});
function renderLegend(){
  const el=document.getElementById("legend");
  el.innerHTML="";
  Object.entries(CATS).forEach(([key,c])=>{
    const chip=document.createElement("button");
    chip.type="button";
    chip.className="chip"+(selectedCats.has(key)?" selected":"");
    chip.innerHTML=`<span class="dot" style="background:${c.color}"></span>${c.label}`;
    chip.onclick=()=>{
      if(selectedCats.has(key)) selectedCats.delete(key);
      else selectedCats.add(key);
      calendarCategoryFilterEnabled=true;
      renderLegend();
      showCategoryPanel();
      renderCalendar();
    };
    el.appendChild(chip);
  });
  updateAllCategoryToggle();
}
function renderMonthNav(){
  const el=document.getElementById("sideMonths");
  if(!el)return;
  el.innerHTML="";
  const all=document.createElement("button");
  all.className="side-month-btn"+(selectedMonths.size===0?" active":"");
  all.textContent="전체";
  all.onclick=()=>{selectedMonths.clear();renderMonthNav();showCategoryPanel();renderCalendar();};
  el.appendChild(all);
  MONTH_NAMES.forEach((name,i)=>{
    const month=i+1;
    const btn=document.createElement("button");
    btn.className="side-month-btn"+(selectedMonths.has(month)?" active":"");
    btn.textContent=name;
    btn.onclick=()=>{
      if(selectedMonths.has(month))selectedMonths.clear();
      else selectedMonths=new Set([month]);
      activeMonth=month;
      renderMonthNav();showCategoryPanel();renderCalendar();
    };
    el.appendChild(btn);
  });
}
function getCategoryEvents(){
  const result=[];
  Object.entries(EVENTS).forEach(([key,events])=>{
    if(selectedMonths.size && !selectedMonths.has(Number(key.slice(0,2))))return;
    events.forEach(event=>{
      if(selectedCats.has(event.cat))result.push({key,event});
    });
  });
  result.sort((a,b)=>a.key.localeCompare(b.key));
  return result;
}
function showCategoryPanel(){
  const panel=document.getElementById("catPanel");
  panel.classList.toggle("show",categoryPanelVisible);
  const toggle=document.getElementById("listVisibilityToggle");
  toggle.textContent=categoryPanelVisible?"목록 숨기기":"목록 보기";
  toggle.setAttribute("aria-expanded",String(categoryPanelVisible));
  if(!categoryPanelVisible)return;
  const items=getCategoryEvents();
  document.getElementById("catPanelTitle").textContent=`선택한 대분류 ${selectedCats.size}개`;
  document.getElementById("catPanelCount").textContent=`기념일 ${items.length}개`;
  const list=document.getElementById("catList");
  list.innerHTML="";
  items.forEach(({key,event})=>{
    const [mm,dd]=key.split("-");
    const item=document.createElement("button");
    item.type="button";item.className="cat-item";
    const cat=CATS[event.cat];
    item.innerHTML=`<span class="cat-date">${Number(mm)}월 ${Number(dd)}일</span><span class="cat-dot" style="background:${cat.color}"></span><span class="cat-name"></span><span class="cat-arrow">›</span>`;
    item.querySelector(".cat-name").textContent=event.title;
    item.onclick=()=>openModal(key,[event]);
    list.appendChild(item);
  });
  if(!items.length)list.innerHTML='<div class="cat-empty">해당 조건의 기념일이 없습니다.</div>';
  panel.classList.add("show");
}
function hideCategoryPanel(){categoryPanelVisible=false;showCategoryPanel();}
function renderTopMonthNav(){
 const nav=document.getElementById("monthnav");nav.innerHTML="";
 const todayBtn=document.createElement("button");todayBtn.className="mbtn today-nav";todayBtn.innerHTML='<span class="today-ko">오늘</span><span class="today-en">TODAY</span>';todayBtn.setAttribute("aria-label","오늘 달력으로 이동");todayBtn.onclick=()=>{const now=new Date();activeMonth=now.getFullYear()<=YEAR?now.getMonth()+1:1;renderCalendar();};nav.appendChild(todayBtn);
 MONTH_NAMES.forEach((name,i)=>{const b=document.createElement("button");b.className="mbtn"+(activeMonth===i+1?" active":"");b.textContent=name;b.onclick=()=>{activeMonth=i+1;renderCalendar();};nav.appendChild(b);});
}
function renderCalendar(){
 renderTopMonthNav();
  document.getElementById("calTitle").textContent = `${YEAR}년 ${MONTH_NAMES[activeMonth-1]}`;
  const monthEvents = Object.entries(EVENTS).filter(([key])=>Number(key.slice(0,2))===activeMonth);
  const visibleCount = monthEvents.reduce((sum,[key,events])=>sum+events.filter(e=>(!calendarCategoryFilterEnabled || selectedCats.has(e.cat)) && (!selectedMonths.size || selectedMonths.has(activeMonth))).length,0);
  document.getElementById("calSummary").textContent=`선택한 대분류 ${selectedCats.size}개 / 기념일 ${visibleCount}개`;
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  WD.forEach((w,i)=>{
    const wd = document.createElement("div");
    wd.className = "wd" + (i===0?" sun":i===6?" sat":"");
    wd.textContent = w;
    grid.appendChild(wd);
  });

  const firstDay = new Date(YEAR, activeMonth-1, 1).getDay();
  const daysInMonth = new Date(YEAR, activeMonth, 0).getDate();

  for(let i=0;i<firstDay;i++){
    const empty = document.createElement("div");
    empty.className = "cell empty";
    grid.appendChild(empty);
  }

  for(let d=1; d<=daysInMonth; d++){
    const dow = new Date(YEAR, activeMonth-1, d).getDay();
    const key = pad(activeMonth) + "-" + pad(d);
    const allEvents = EVENTS[key] || [];
    const events = allEvents.filter(e=>(!calendarCategoryFilterEnabled || selectedCats.has(e.cat)) && (!selectedMonths.size || selectedMonths.has(activeMonth)));
    const now = new Date();
    const isToday = (now.getFullYear() <= YEAR && now.getMonth()+1===activeMonth && now.getDate()===d);

    const cell = document.createElement("div");
    cell.className = "cell" + (dow===0?" sun":dow===6?" sat":"") + (isToday?" today":"") + (events.length? " clickable":"");

    const num = document.createElement("div");
    num.className = "daynum";
    num.textContent = d;
    cell.appendChild(num);

    if(events.length){
      const eventList = document.createElement("div");
      eventList.className = "dots";
      eventList.style.cssText = "display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden;";

      const visibleEvents = events.slice(0, 4);
      visibleEvents.forEach(e=>{
        const row = document.createElement("div");
        row.style.cssText = "display:flex;align-items:center;gap:5px;width:100%;min-width:0;height:18px;line-height:18px;overflow:hidden;";

        const dot = document.createElement("span");
        dot.className = "dot";
        dot.style.background = CATS[e.cat].color;
        dot.style.flex = "0 0 auto";

        const label = document.createElement("span");
        label.className = "ev-label";
        label.style.cssText = "margin:0;flex:1 1 auto;min-width:0;width:0;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:18px;";
        label.textContent = e.title;

        row.appendChild(dot);
        row.appendChild(label);
        eventList.appendChild(row);
      });

      if(events.length > 4){
        const more = document.createElement("div");
        more.className = "more-events";
        more.textContent = `+ ${events.length - 4}개 더보기`;
        more.style.cssText = "height:16px;line-height:16px;padding-left:14px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;";
        eventList.appendChild(more);
      }

      cell.appendChild(eventList);

      cell.onclick = ()=> openModal(key, events);
    }

    grid.appendChild(cell);
  }

  const totalCells = firstDay + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for(let i=0;i<trailing;i++){
    const empty = document.createElement("div");
    empty.className = "cell empty";
    grid.appendChild(empty);
  }
}


function escCheckText(v){
  return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function renderCheckList(note){
  let raw=String(note ?? '').replace(/\r\n?/g,'\n').trim();
  if(!raw || raw==="#N/A") return '<p class="ev-sec-text">등록된 체크사항이 없습니다.</p>';
  raw=raw.replace(/<br\s*\/?>/gi,'\n');
  let parts=raw.split(/(?:^|\n)\s*·\s*/).filter(Boolean);
  if(parts.length<=1 && raw.includes('·')) parts=raw.split(/\s*·\s*/).filter(Boolean);
  if(!parts.length) parts=[raw];
  return '<ul class="check-list ev-sec-text">'+parts.map(p =>
    '<li class="check-item"><span>·</span><span>'+escCheckText(p.trim()).replace(/\n+/g,' ')+'</span></li>'
  ).join('')+'</ul>';
}

function openModal(key, events){
  const [mm, dd] = key.split("-");
  document.getElementById("modalDate").textContent = `${YEAR}년 ${parseInt(mm)}월 ${parseInt(dd)}일`;
  const body = document.getElementById("modalBody");
  body.innerHTML = "";
  events.forEach(e=>{
    const c = CATS[e.cat];
    const links = e.links || [];
    const refHtml = links.length
      ? `<ul class="ref-list">${links.map(l=>`<li><a href="${l.url}" target="_blank" rel="noopener noreferrer">${l.label}</a></li>`).join("")}</ul>`
      : `<div class="ref-empty">등록된 참고자료가 없습니다. links 필드에 추가해보세요.</div>`;
    const card = document.createElement("div");
    card.className = "ev-card";
    card.innerHTML = `
      <span class="badge" style="background:${c.bg};color:${c.color}">${c.label}</span>
      <div class="ev-title">${e.title}</div>
      <div class="ev-sec-label">개념 · 설명</div>
      <p class="ev-sec-text">${e.desc}</p>
      <div class="ev-sec-label">마케팅 시 주의할 점</div>
      <div class="caution-box"><p class="ev-sec-text">${e.caution}</p></div>
      <div class="ev-sec-label" style="margin-top:12px;">체크사항</div>
      <div class="caution-box">${renderCheckList(e.note)}</div>
      <div class="ev-sec-label" style="margin-top:12px;">참고자료</div>
      <div class="ref-box">${refHtml}</div>
    `;
    body.appendChild(card);
  });
  document.getElementById("overlay").classList.add("show");
}

function closeModal(){
  document.getElementById("overlay").classList.remove("show");
}

document.getElementById("closeBtn").onclick = closeModal;
document.getElementById("overlay").onclick = (e)=>{ if(e.target.id==="overlay") closeModal(); };
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeModal(); });
