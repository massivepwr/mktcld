<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 마케팅 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEBE3;
    --card:#FBFAF6;
    --ink:#232620;
    --ink-soft:#5B5A52;
    --line:#D8D5C9;

    --c-consumer:#A9791F;
    --c-consumer-bg:#F1E7CF;
    --c-safety:#3F6B5B;
    --c-safety-bg:#E4EEE9;
    --c-rights:#8A4F7D;
    --c-rights-bg:#F1E5EE;
    --c-history:#2C3E63;
    --c-history-bg:#E4E8F0;
    --c-culture:#B5473F;
    --c-culture-bg:#F4E3DF;
    --c-sports:#5F7A55;
    --c-sports-bg:#E6ECDD;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    padding:28px 16px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;}

  /* header */
  .head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
    border-bottom:2px solid var(--ink);
    padding-bottom:18px;
    margin-bottom:20px;
  }
  .head h1{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:34px;
    line-height:1.15;
    margin:0;
  }
  .head h1 small{
    display:block;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:500;
    font-size:14px;
    color:var(--ink-soft);
    margin-top:6px;
    letter-spacing:.02em;
  }
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    max-width:420px;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    padding:5px 10px 5px 8px;
    border-radius:100px;
    border:1px solid var(--line);
    background:var(--card);
    cursor:pointer;
    user-select:none;
    transition:opacity .15s ease, transform .1s ease;
    color:var(--ink);
    line-height:1.2;
  }
  .chip:active{transform:scale(0.97);}
  .chip.off{opacity:.35;}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;}

  /* month nav */
  .monthnav{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:18px;
  }
  .mbtn{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    font-family:'Noto Sans KR', sans-serif;
    font-size:13.5px;
    font-weight:500;
    padding:7px 12px;
    border-radius:8px;
    cursor:pointer;
  }
  .mbtn.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
    font-weight:700;
  }

  /* calendar */
  .cal-title{
    font-family:'Noto Serif KR', serif;
    font-size:22px;
    font-weight:700;
    margin:6px 0 12px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(7, minmax(0,1fr));
    gap:6px;
    width:100%;
  }
  .wd{
    text-align:center;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    padding-bottom:4px;
  }
  .wd.sun{color:#B5473F;}
  .wd.sat{color:#2C3E63;}
  .cell{
    min-height:78px;
    min-width:0;
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 6px 8px;
    position:relative;
    overflow:hidden;
  }
  .cell.empty{background:transparent;border-color:transparent;}
  .cell.clickable{cursor:pointer;}
  .cell.clickable:hover{border-color:var(--ink);}
  .cell.today{outline:2px solid var(--ink);outline-offset:-2px;}
  .daynum{
    font-size:13px;
    font-weight:700;
    color:var(--ink);
  }
  .cell.sun .daynum{color:#B5473F;}
  .cell.sat .daynum{color:#2C3E63;}
  .dots{
    display:flex;
    flex-wrap:wrap;
    gap:3px;
    margin-top:6px;
  }
  .ev-label{
    font-size:10.5px;
    line-height:1.3;
    color:var(--ink);
    margin-top:4px;
    display:block;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .note{
    margin-top:22px;
    font-size:12.5px;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
    padding-top:14px;
    line-height:1.6;
  }

  /* category event list */
  .cat-panel{
    display:none;
    margin:8px 0 22px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .cat-panel.show{display:block;}
  .cat-panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:15px 17px;
    border-bottom:1px solid var(--line);
  }
  .cat-panel-title{
    font-family:'Noto Serif KR', serif;
    font-size:18px;
    font-weight:700;
    margin:0;
  }
  .cat-panel-count{
    font-size:11.5px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .cat-list{padding:6px 10px 10px;}
  .cat-item{
    display:grid;
    grid-template-columns:88px 10px minmax(0,1fr) 18px;
    align-items:center;
    gap:9px;
    width:100%;
    border:0;
    border-bottom:1px solid var(--line);
    background:transparent;
    padding:12px 7px;
    text-align:left;
    color:var(--ink);
    cursor:pointer;
    font-family:'Noto Sans KR', sans-serif;
  }
  .cat-item:last-child{border-bottom:0;}
  .cat-item:hover{background:var(--paper);}
  .cat-date{
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .cat-dot{
    width:8px;height:8px;border-radius:50%;
  }
  .cat-name{
    min-width:0;
    font-size:13.5px;
    font-weight:700;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .cat-arrow{
    font-size:18px;
    color:var(--ink-soft);
    text-align:center;
  }
  .cat-empty{
    padding:18px 10px;
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
  }
  .chip.selected{
    border-color:var(--ink);
    box-shadow:0 0 0 1px var(--ink) inset;
  }

  /* modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(35,38,32,.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--card);
    max-width:460px;
    width:100%;
    max-height:82vh;
    overflow-y:auto;
    border-radius:14px;
    padding:22px 22px 20px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .modal-date{
    font-family:'Noto Serif KR', serif;
    font-size:20px;
    font-weight:700;
    margin:0 0 14px;
  }
  .ev-card{
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 15px;
    margin-bottom:12px;
  }
  .ev-card:last-child{margin-bottom:0;}
  .badge{
    display:inline-block;
    font-size:11.5px;
    font-weight:700;
    padding:3px 9px;
    border-radius:100px;
    margin-bottom:8px;
  }
  .ev-title{
    font-size:16.5px;
    font-weight:700;
    margin:0 0 10px;
  }
  .ev-sec-label{
    font-size:11.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:3px;
  }
  .ev-sec-text{
    font-size:13.5px;
    line-height:1.6;
    margin:0 0 10px;
  }
  .caution-box{
    background:var(--paper);
    border-radius:8px;
    padding:10px 12px;
    margin-top:2px;
  }
  .caution-box .ev-sec-text{margin-bottom:0;}
  .ref-box{
    margin-top:12px;
  }
  .ref-list{
    list-style:none;
    margin:0;
    padding:0;
  }
  .ref-list li{
    margin-bottom:5px;
  }
  .ref-list a{
    font-size:13px;
    color:var(--c-hist);
    text-decoration:none;
    border-bottom:1px solid currentColor;
  }
  .ref-list a:hover{opacity:.7;}
  .ref-empty{
    font-size:12.5px;
    color:var(--ink-soft);
    font-style:italic;
  }
  .close-btn{
    display:block;
    margin:16px auto 0;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:9px 20px;
    border-radius:8px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
  }

  @media (max-width:520px){
    .cat-item{grid-template-columns:76px 9px minmax(0,1fr) 16px;padding:11px 5px;}
    .cat-name{font-size:13px;}

    .cell{min-height:64px;}
    .ev-label{display:none;}
    .head h1{font-size:27px;}
  }
</style>

<style>
/* 사용자 제공 기념일 병합 표시 */
.cat-panel-note{
  margin-top:6px;
  font-size:12px;
  color:#6b7280;
}
</style>

<style id="vertical-event-layout">.dots{display:flex!important;flex-direction:column!important;align-items:flex-start!important;gap:4px!important;margin-top:5px!important}.dots .dot{width:10px!important;height:10px!important;min-width:10px!important;border-radius:50%!important;display:block!important}.ev-label{display:block!important;margin-top:2px!important;font-size:11px!important;line-height:15px!important;white-space:normal!important;overflow:hidden!important;text-overflow:ellipsis!important;word-break:keep-all!important}.cell:has(.dots){cursor:pointer!important}.cell:has(.dots):hover{background:rgba(0,0,0,.025)!important}@media(max-width:720px){.dots{gap:3px!important}.dots .dot{width:8px!important;height:8px!important}.ev-label{font-size:10px!important;line-height:13px!important}}</style>
<style id="calendar-uniform-layout">
/* 모든 날짜 셀의 가로/세로 크기를 균일하게 유지 */
.calendar-grid{
  grid-template-columns:repeat(7,minmax(0,1fr)) !important;
  grid-auto-rows:112px !important;
  align-items:stretch !important;
}
.day{
  min-width:0 !important;
  min-height:0 !important;
  height:112px !important;
  box-sizing:border-box !important;
  overflow:hidden !important;
  display:flex !important;
  flex-direction:column !important;
  padding:7px 6px !important;
}
.day.empty{
  height:112px !important;
}
.day-num{
  flex:0 0 auto !important;
  margin-bottom:4px !important;
  line-height:20px !important;
}
.day-events{
  flex:1 1 auto !important;
  min-height:0 !important;
  display:flex !important;
  flex-direction:column !important;
  align-items:stretch !important;
  justify-content:flex-start !important;
  gap:2px !important;
  margin-top:0 !important;
  overflow:hidden !important;
}
.event-pill{
  flex:0 0 19px !important;
  height:19px !important;
  min-height:19px !important;
  max-height:19px !important;
  box-sizing:border-box !important;
  padding:0 2px !important;
  gap:5px !important;
  overflow:hidden !important;
  line-height:19px !important;
}
.event-pill .event-dot{
  flex:0 0 9px !important;
  width:9px !important;
  height:9px !important;
  min-width:9px !important;
  max-width:9px !important;
}
.event-pill .event-name{
  display:block !important;
  flex:1 1 auto !important;
  min-width:0 !important;
  max-width:100% !important;
  overflow:hidden !important;
  text-overflow:ellipsis !important;
  white-space:nowrap !important;
  word-break:normal !important;
  overflow-wrap:normal !important;
  font-size:11px !important;
  line-height:19px !important;
  height:19px !important;
  max-height:19px !important;
}

/* 화면이 작아져도 셀 비율을 유지 */
@media (max-width:720px){
  .calendar-grid{grid-auto-rows:92px !important;}
  .day,.day.empty{height:92px !important;padding:6px 4px !important;}
  .day-num{line-height:18px !important;margin-bottom:3px !important;}
  .event-pill{
    flex-basis:17px !important;
    height:17px !important;
    min-height:17px !important;
    max-height:17px !important;
    gap:4px !important;
  }
  .event-pill .event-dot{
    width:8px !important;height:8px !important;
    min-width:8px !important;max-width:8px !important;
  }
  .event-pill .event-name{
    font-size:10px !important;
    line-height:17px !important;
    height:17px !important;
    max-height:17px !important;
  }
}
@media (max-width:520px){
  .calendar-grid{grid-auto-rows:82px !important;}
  .day,.day.empty{height:82px !important;padding:5px 3px !important;}
  .event-pill{
    flex-basis:16px !important;
    height:16px !important;
    min-height:16px !important;
    max-height:16px !important;
    gap:3px !important;
  }
  .event-pill .event-name{
    font-size:9px !important;
    line-height:16px !important;
    height:16px !important;
    max-height:16px !important;
  }
}
</style>


<style id="four-event-display-fix">
/* Calendar cell stability */
.calendar-grid, .calendar {
  min-width: 0;
}

.cell {
  min-width: 0 !important;
  box-sizing: border-box !important;
  overflow: hidden !important;
}

.dots {
  min-width: 0 !important;
  max-width: 100% !important;
  overflow: hidden !important;
}

.ev-label {
  min-width: 0 !important;
  width: 0 !important;
  display: block !important;
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
}

.more-events {
  color: #666;
}
</style>

</head>
<body>
<div class="wrap">

  <div class="head">
    <h1>2027 마케팅 캘린더
      <small>날짜를 클릭하면 개념·설명과 마케팅 시 주의할 점을 볼 수 있어요</small>
    </h1>
    <div class="legend" id="legend"></div>
  </div>

  <div class="monthnav" id="monthnav"></div>

  <div class="cat-panel" id="catPanel">
    <div class="cat-panel-head">
      <h2 class="cat-panel-title" id="catPanelTitle"></h2>
      <span class="cat-panel-count" id="catPanelCount"></span><div class="cat-panel-note">기존 캘린더와 사용자 제공 표의 중복 기념일은 1개로 통합</div>
    </div>
    <div class="cat-list" id="catList"></div>
  </div>

  <div class="cal-title" id="calTitle"></div>
  <div class="grid" id="grid"></div>

  <div class="note">
    ⓘ 음력 기념일(설날·정월대보름·추석·삼복 등)은 2027년 실제 환산 날짜를 기준으로 표시했습니다. 2027 FIFA U-20 월드컵은 공식 세부 일정 확정 전까지 임시 표기입니다. 안전·환경 카테고리의 참사·재난 추모일은 전후 프로모션 톤 조절이 특히 필요한 날짜입니다.
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-date" id="modalDate"></div>
    <div id="modalBody"></div>
    <button class="close-btn" id="closeBtn">닫기</button>
  </div>
</div>

<script>
const CATS = {
  consumer: { label:"소비자·마케팅",       color:"#A9791F", bg:"#F1E7CF" },
  safety:   { label:"안전·환경",           color:"#3F6B5B", bg:"#E4EEE9" },
  rights:   { label:"노동·인권·다양성",    color:"#8A4F7D", bg:"#F1E5EE" },
  history:  { label:"정치·역사",           color:"#2C3E63", bg:"#E4E8F0" },
  culture:  { label:"문화·종교",           color:"#B5473F", bg:"#F4E3DF" },
  sports:   { label:"스포츠",              color:"#5F7A55", bg:"#E6ECDD" },

const YEAR = 2027;
const MONTH_NAMES = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
const WD = ["일","월","화","수","목","금","토"];
const TODAY = new Date(2027,0,1); // 2027-01-01 (2027 캘린더 기준)

let activeMonth = 1;
let activeCats = new Set(Object.keys(CATS));
  let selectedCat = null;

function pad(n){ return n<10 ? "0"+n : ""+n; }


// ===== 사용자 제공 기념일 표 추가 데이터 =====
// 동일한 (카테고리+날짜+기념일명)은 1회만 추가되며,
// 날짜가 같아도 기념일명이 다르면 각각 별도 이벤트로 표시됩니다.
const USER_ADDED_EVENTS = [];
function mergeUserAddedEvents(){
  USER_ADDED_EVENTS.forEach(item => {
    if(!EVENTS[item.date]) EVENTS[item.date] = [];

    // 동일 기념일(같은 카테고리·날짜·명칭)은 중복 추가하지 않음
    const duplicated = EVENTS[item.date].some(e =>
      e.cat === item.cat && e.title === item.title
    );
    if(!duplicated){
      EVENTS[item.date].push({
        cat:item.cat,
        title:item.title,
        desc:item.desc,
        caution:item.caution
      });
    }
  });
}

mergeUserAddedEvents();


function renderLegend(){
  const el = document.getElementById("legend");
  el.innerHTML = "";
  Object.entries(CATS).forEach(([key, c])=>{
    const chip = document.createElement("div");
    chip.className = "chip" + (selectedCat === key ? " selected" : "");
    chip.innerHTML = `<span class="dot" style="background:${c.color}"></span>${c.label}`;
    chip.onclick = ()=>{
      if(selectedCat === key){
        selectedCat = null;
        hideCategoryPanel();
      }else{
        selectedCat = key;
        showCategoryPanel(key);
      }
      renderLegend();
    };
    el.appendChild(chip);
  });
}

function renderMonthNav(){
  const el = document.getElementById("monthnav");
  el.innerHTML = "";
  MONTH_NAMES.forEach((name, i)=>{
    const btn = document.createElement("button");
    btn.className = "mbtn" + (activeMonth === i+1 ? " active" : "");
    btn.textContent = name;
    btn.onclick = ()=>{ activeMonth = i+1; renderMonthNav(); renderCalendar(); };
    el.appendChild(btn);
  });
}

function getCategoryEvents(catKey){
  const result = [];
  Object.entries(EVENTS).forEach(([key, events])=>{
    events.forEach(event=>{
      if(event.cat === catKey){
        result.push({key, event});
      }
    });
  });
  result.sort((a,b)=>a.key.localeCompare(b.key));
  return result;
}

function showCategoryPanel(catKey){
  const panel = document.getElementById("catPanel");
  const title = document.getElementById("catPanelTitle");
  const count = document.getElementById("catPanelCount");
  const list = document.getElementById("catList");
  const cat = CATS[catKey];
  const items = getCategoryEvents(catKey);

  title.textContent = cat.label;
  count.textContent = `총 ${items.length}개`;
  list.innerHTML = "";

  items.forEach(({key, event})=>{
    const [mm, dd] = key.split("-");
    const item = document.createElement("button");
    item.type = "button";
    item.className = "cat-item";
    item.innerHTML = `
      <span class="cat-date">${parseInt(mm)}월 ${parseInt(dd)}일</span>
      <span class="cat-dot" style="background:${cat.color}"></span>
      <span class="cat-name">${event.title}</span>
      <span class="cat-arrow">›</span>
    `;
    item.onclick = ()=> openModal(key, [event]);
    list.appendChild(item);
  });

  panel.classList.add("show");
}

function hideCategoryPanel(){
  document.getElementById("catPanel").classList.remove("show");
}

function renderCalendar(){
  document.getElementById("calTitle").textContent = `${YEAR}년 ${MONTH_NAMES[activeMonth-1]}`;
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  WD.forEach((w,i)=>{
    const wd = document.createElement("div");
    wd.className = "wd" + (i===0?" sun":i===6?" sat":"");
    wd.textContent = w;
    grid.appendChild(wd);
  });

  const firstDay = new Date(YEAR, activeMonth-1, 1).getDay();
  const daysInMonth = new Date(YEAR, activeMonth, 0).getDate();

  for(let i=0;i<firstDay;i++){
    const empty = document.createElement("div");
    empty.className = "cell empty";
    grid.appendChild(empty);
  }

  for(let d=1; d<=daysInMonth; d++){
    const dow = new Date(YEAR, activeMonth-1, d).getDay();
    const key = pad(activeMonth) + "-" + pad(d);
    const allEvents = EVENTS[key] || [];
    const events = allEvents;
    const isToday = (YEAR===2026 && activeMonth===9 && d===8);

    const cell = document.createElement("div");
    cell.className = "cell" + (dow===0?" sun":dow===6?" sat":"") + (isToday?" today":"") + (events.length? " clickable":"");

    const num = document.createElement("div");
    num.className = "daynum";
    num.textContent = d;
    cell.appendChild(num);

    if(events.length){
      const eventList = document.createElement("div");
      eventList.className = "dots";
      eventList.style.cssText = "display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden;";

      const visibleEvents = events.slice(0, 4);
      visibleEvents.forEach(e=>{
        const row = document.createElement("div");
        row.style.cssText = "display:flex;align-items:center;gap:5px;width:100%;min-width:0;height:18px;line-height:18px;overflow:hidden;";

        const dot = document.createElement("span");
        dot.className = "dot";
        dot.style.background = CATS[e.cat].color;
        dot.style.flex = "0 0 auto";

        const label = document.createElement("span");
        label.className = "ev-label";
        label.style.cssText = "margin:0;flex:1 1 auto;min-width:0;width:0;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:18px;";
        label.textContent = e.title;

        row.appendChild(dot);
        row.appendChild(label);
        eventList.appendChild(row);
      });

      if(events.length > 4){
        const more = document.createElement("div");
        more.className = "more-events";
        more.textContent = `+ ${events.length - 4}개 더보기`;
        more.style.cssText = "height:16px;line-height:16px;padding-left:14px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;";
        eventList.appendChild(more);
      }

      cell.appendChild(eventList);

      cell.onclick = ()=> openModal(key, events);
    }

    grid.appendChild(cell);
  }

  const totalCells = firstDay + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for(let i=0;i<trailing;i++){
    const empty = document.createElement("div");
    empty.className = "cell empty";
    grid.appendChild(empty);
  }
}

function openModal(key, events){
  const [mm, dd] = key.split("-");
  document.getElementById("modalDate").textContent = `${YEAR}년 ${parseInt(mm)}월 ${parseInt(dd)}일`;
  const body = document.getElementById("modalBody");
  body.innerHTML = "";
  events.forEach(e=>{
    const c = CATS[e.cat];
    const links = e.links || [];
    const refHtml = links.length
      ? `<ul class="ref-list">${links.map(l=>`<li><a href="${l.url}" target="_blank" rel="noopener noreferrer">${l.label}</a></li>`).join("")}</ul>`
      : `<div class="ref-empty">등록된 참고자료가 없습니다. links 필드에 추가해보세요.</div>`;
    const card = document.createElement("div");
    card.className = "ev-card";
    card.innerHTML = `
      <span class="badge" style="background:${c.bg};color:${c.color}">${c.label}</span>
      <div class="ev-title">${e.title}</div>
      <div class="ev-sec-label">개념 · 설명</div>
      <p class="ev-sec-text">${e.desc}</p>
      <div class="ev-sec-label">마케팅 시 주의할 점</div>
      <div class="caution-box"><p class="ev-sec-text">${e.caution}</p></div>
      <div class="ev-sec-label" style="margin-top:12px;">참고자료</div>
      <div class="ref-box">${refHtml}</div>
    `;
    body.appendChild(card);
  });
  document.getElementById("overlay").classList.add("show");
}

function closeModal(){
  document.getElementById("overlay").classList.remove("show");
}

document.getElementById("closeBtn").onclick = closeModal;
document.getElementById("overlay").onclick = (e)=>{ if(e.target.id==="overlay") closeModal(); };
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeModal(); });

renderLegend();
renderMonthNav();
renderCalendar();
