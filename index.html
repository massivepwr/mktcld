<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 마케팅 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEBE3;
    --card:#FBFAF6;
    --ink:#232620;
    --ink-soft:#5B5A52;
    --line:#D8D5C9;

    --c-hist:#2C3E63;
    --c-hist-bg:#E4E8F0;
    --c-disaster:#3F3D3A;
    --c-disaster-bg:#E5E3DF;
    --c-culture:#B5473F;
    --c-culture-bg:#F4E3DF;
    --c-season:#5F7A55;
    --c-season-bg:#E6ECDD;
    --c-global:#A9791F;
    --c-global-bg:#F1E7CF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    padding:28px 16px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;}

  /* header */
  .head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
    border-bottom:2px solid var(--ink);
    padding-bottom:18px;
    margin-bottom:20px;
  }
  .head h1{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:34px;
    line-height:1.15;
    margin:0;
  }
  .head h1 small{
    display:block;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:500;
    font-size:14px;
    color:var(--ink-soft);
    margin-top:6px;
    letter-spacing:.02em;
  }
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    max-width:420px;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    padding:5px 10px 5px 8px;
    border-radius:100px;
    border:1px solid var(--line);
    background:var(--card);
    cursor:pointer;
    user-select:none;
    transition:opacity .15s ease, transform .1s ease;
    color:var(--ink);
    line-height:1.2;
  }
  .chip:active{transform:scale(0.97);}
  .chip.off{opacity:.35;}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;}

  /* month nav */
  .monthnav{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:18px;
  }
  .mbtn{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    font-family:'Noto Sans KR', sans-serif;
    font-size:13.5px;
    font-weight:500;
    padding:7px 12px;
    border-radius:8px;
    cursor:pointer;
  }
  .mbtn.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
    font-weight:700;
  }

  /* calendar */
  .cal-title{
    font-family:'Noto Serif KR', serif;
    font-size:22px;
    font-weight:700;
    margin:6px 0 12px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(7, minmax(0,1fr));
    gap:6px;
    width:100%;
  }
  .wd{
    text-align:center;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    padding-bottom:4px;
  }
  .wd.sun{color:#B5473F;}
  .wd.sat{color:#2C3E63;}
  .cell{
    min-height:78px;
    min-width:0;
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 6px 8px;
    position:relative;
    overflow:hidden;
  }
  .cell.empty{background:transparent;border-color:transparent;}
  .cell.clickable{cursor:pointer;}
  .cell.clickable:hover{border-color:var(--ink);}
  .cell.today{outline:2px solid var(--ink);outline-offset:-2px;}
  .daynum{
    font-size:13px;
    font-weight:700;
    color:var(--ink);
  }
  .cell.sun .daynum{color:#B5473F;}
  .cell.sat .daynum{color:#2C3E63;}
  .dots{
    display:flex;
    flex-wrap:wrap;
    gap:3px;
    margin-top:6px;
  }
  .ev-label{
    font-size:10.5px;
    line-height:1.3;
    color:var(--ink);
    margin-top:4px;
    display:block;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .note{
    margin-top:22px;
    font-size:12.5px;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
    padding-top:14px;
    line-height:1.6;
  }

  /* category event list */
  .cat-panel{
    display:none;
    margin:8px 0 22px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .cat-panel.show{display:block;}
  .cat-panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:15px 17px;
    border-bottom:1px solid var(--line);
  }
  .cat-panel-title{
    font-family:'Noto Serif KR', serif;
    font-size:18px;
    font-weight:700;
    margin:0;
  }
  .cat-panel-count{
    font-size:11.5px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .cat-list{padding:6px 10px 10px;}
  .cat-item{
    display:grid;
    grid-template-columns:88px 10px minmax(0,1fr) 18px;
    align-items:center;
    gap:9px;
    width:100%;
    border:0;
    border-bottom:1px solid var(--line);
    background:transparent;
    padding:12px 7px;
    text-align:left;
    color:var(--ink);
    cursor:pointer;
    font-family:'Noto Sans KR', sans-serif;
  }
  .cat-item:last-child{border-bottom:0;}
  .cat-item:hover{background:var(--paper);}
  .cat-date{
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .cat-dot{
    width:8px;height:8px;border-radius:50%;
  }
  .cat-name{
    min-width:0;
    font-size:13.5px;
    font-weight:700;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .cat-arrow{
    font-size:18px;
    color:var(--ink-soft);
    text-align:center;
  }
  .cat-empty{
    padding:18px 10px;
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
  }
  .chip.selected{
    border-color:var(--ink);
    box-shadow:0 0 0 1px var(--ink) inset;
  }

  /* modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(35,38,32,.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--card);
    max-width:460px;
    width:100%;
    max-height:82vh;
    overflow-y:auto;
    border-radius:14px;
    padding:22px 22px 20px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .modal-date{
    font-family:'Noto Serif KR', serif;
    font-size:20px;
    font-weight:700;
    margin:0 0 14px;
  }
  .ev-card{
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 15px;
    margin-bottom:12px;
  }
  .ev-card:last-child{margin-bottom:0;}
  .badge{
    display:inline-block;
    font-size:11.5px;
    font-weight:700;
    padding:3px 9px;
    border-radius:100px;
    margin-bottom:8px;
  }
  .ev-title{
    font-size:16.5px;
    font-weight:700;
    margin:0 0 10px;
  }
  .ev-sec-label{
    font-size:11.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:3px;
  }
  .ev-sec-text{
    font-size:13.5px;
    line-height:1.6;
    margin:0 0 10px;
  }
  .caution-box{
    background:var(--paper);
    border-radius:8px;
    padding:10px 12px;
    margin-top:2px;
  }
  .caution-box .ev-sec-text{margin-bottom:0;}
  .check-list{
    margin:0;
    padding:0;
    list-style:none;
    font-family:inherit !important;
    font-size:13.5px !important;
    font-weight:400 !important;
    line-height:1.6 !important;
    color:inherit;
  }
  .check-item{
    display:grid;
    grid-template-columns:14px minmax(0,1fr);
    column-gap:4px;
    align-items:start;
    margin:0 0 4px 0;
    font-family:inherit !important;
    font-size:13.5px !important;
    font-weight:400 !important;
    line-height:1.6 !important;
  }
  .check-item:last-child{margin-bottom:0;}
  .check-item span{
    font-family:inherit !important;
    font-size:13.5px !important;
    font-weight:400 !important;
    line-height:1.6 !important;
  }

  .ref-box{
    margin-top:12px;
  }
  .ref-list{
    list-style:none;
    margin:0;
    padding:0;
  }
  .ref-list li{
    margin-bottom:5px;
  }
  .ref-list a{
    font-size:13px;
    color:var(--c-hist);
    text-decoration:none;
    border-bottom:1px solid currentColor;
  }
  .ref-list a:hover{opacity:.7;}
  .ref-empty{
    font-size:12.5px;
    color:var(--ink-soft);
    font-style:italic;
  }
  .close-btn{
    display:block;
    margin:16px auto 0;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:9px 20px;
    border-radius:8px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
  }

  @media (max-width:520px){
    .cat-item{grid-template-columns:76px 9px minmax(0,1fr) 16px;padding:11px 5px;}
    .cat-name{font-size:13px;}

    .cell{min-height:64px;}
    .ev-label{display:none;}
    .head h1{font-size:27px;}
  }
</style>

<style>
/* 사용자 제공 기념일 병합 표시 */
.cat-panel-note{
  margin-top:6px;
  font-size:12px;
  color:#6b7280;
}
</style>

<style id="vertical-event-layout">.dots{display:flex!important;flex-direction:column!important;align-items:flex-start!important;gap:4px!important;margin-top:5px!important}.dots .dot{width:10px!important;height:10px!important;min-width:10px!important;border-radius:50%!important;display:block!important}.ev-label{display:block!important;margin-top:2px!important;font-size:11px!important;line-height:15px!important;white-space:normal!important;overflow:hidden!important;text-overflow:ellipsis!important;word-break:keep-all!important}.cell:has(.dots){cursor:pointer!important}.cell:has(.dots):hover{background:rgba(0,0,0,.025)!important}@media(max-width:720px){.dots{gap:3px!important}.dots .dot{width:8px!important;height:8px!important}.ev-label{font-size:10px!important;line-height:13px!important}}</style>
<style id="calendar-uniform-layout">
/* 모든 날짜 셀의 가로/세로 크기를 균일하게 유지 */
.calendar-grid{
  grid-template-columns:repeat(7,minmax(0,1fr)) !important;
  grid-auto-rows:112px !important;
  align-items:stretch !important;
}
.day{
  min-width:0 !important;
  min-height:0 !important;
  height:112px !important;
  box-sizing:border-box !important;
  overflow:hidden !important;
  display:flex !important;
  flex-direction:column !important;
  padding:7px 6px !important;
}
.day.empty{
  height:112px !important;
}
.day-num{
  flex:0 0 auto !important;
  margin-bottom:4px !important;
  line-height:20px !important;
}
.day-events{
  flex:1 1 auto !important;
  min-height:0 !important;
  display:flex !important;
  flex-direction:column !important;
  align-items:stretch !important;
  justify-content:flex-start !important;
  gap:2px !important;
  margin-top:0 !important;
  overflow:hidden !important;
}
.event-pill{
  flex:0 0 19px !important;
  height:19px !important;
  min-height:19px !important;
  max-height:19px !important;
  box-sizing:border-box !important;
  padding:0 2px !important;
  gap:5px !important;
  overflow:hidden !important;
  line-height:19px !important;
}
.event-pill .event-dot{
  flex:0 0 9px !important;
  width:9px !important;
  height:9px !important;
  min-width:9px !important;
  max-width:9px !important;
}
.event-pill .event-name{
  display:block !important;
  flex:1 1 auto !important;
  min-width:0 !important;
  max-width:100% !important;
  overflow:hidden !important;
  text-overflow:ellipsis !important;
  white-space:nowrap !important;
  word-break:normal !important;
  overflow-wrap:normal !important;
  font-size:11px !important;
  line-height:19px !important;
  height:19px !important;
  max-height:19px !important;
}

/* 화면이 작아져도 셀 비율을 유지 */
@media (max-width:720px){
  .calendar-grid{grid-auto-rows:92px !important;}
  .day,.day.empty{height:92px !important;padding:6px 4px !important;}
  .day-num{line-height:18px !important;margin-bottom:3px !important;}
  .event-pill{
    flex-basis:17px !important;
    height:17px !important;
    min-height:17px !important;
    max-height:17px !important;
    gap:4px !important;
  }
  .event-pill .event-dot{
    width:8px !important;height:8px !important;
    min-width:8px !important;max-width:8px !important;
  }
  .event-pill .event-name{
    font-size:10px !important;
    line-height:17px !important;
    height:17px !important;
    max-height:17px !important;
  }
}
@media (max-width:520px){
  .calendar-grid{grid-auto-rows:82px !important;}
  .day,.day.empty{height:82px !important;padding:5px 3px !important;}
  .event-pill{
    flex-basis:16px !important;
    height:16px !important;
    min-height:16px !important;
    max-height:16px !important;
    gap:3px !important;
  }
  .event-pill .event-name{
    font-size:9px !important;
    line-height:16px !important;
    height:16px !important;
    max-height:16px !important;
  }
}
</style>


<style id="four-event-display-fix">
/* Calendar cell stability */
.calendar-grid, .calendar {
  min-width: 0;
}

.cell {
  min-width: 0 !important;
  box-sizing: border-box !important;
  overflow: hidden !important;
}

.dots {
  min-width: 0 !important;
  max-width: 100% !important;
  overflow: hidden !important;
}

.ev-label {
  min-width: 0 !important;
  width: 0 !important;
  display: block !important;
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
}

.more-events {
  color: #666;
}
</style>

</head>
<body>
<div class="wrap">

  <div class="head">
    <h1>2027 마케팅 캘린더
      <small>날짜를 클릭하면 개념·설명과 마케팅 시 주의할 점을 볼 수 있어요</small>
    </h1>
    <div class="legend" id="legend"></div>
  </div>

  <div class="monthnav" id="monthnav"></div>

  <div class="cat-panel" id="catPanel">
    <div class="cat-panel-head">
      <h2 class="cat-panel-title" id="catPanelTitle"></h2>
      <span class="cat-panel-count" id="catPanelCount"></span><div class="cat-panel-note">기존 캘린더와 사용자 제공 표의 중복 기념일은 1개로 통합</div>
    </div>
    <div class="cat-list" id="catList"></div>
  </div>

  <div class="cal-title" id="calTitle"></div>
  <div class="grid" id="grid"></div>

  <div class="note">
    ⓘ 음력 기념일(설날·정월대보름·추석·삼복 등)은 2027년 실제 환산 날짜를 기준으로 표시했습니다. 2027 FIFA U-20 월드컵은 공식 세부 일정 확정 전까지 임시 표기입니다. 국가 참사 추모일은 애도 기간 전후 프로모션 톤 조절이 특히 필요한 날짜입니다.
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-date" id="modalDate"></div>
    <div id="modalBody"></div>
    <button class="close-btn" id="closeBtn">닫기</button>
  </div>
</div>

<script>
const CATS = {
  cat1: { label:"소비자·마케팅", color:"#A9791F", bg:"#F1E7CF" },
  cat5: { label:"안전·환경", color:"#3F6B5B", bg:"#E6ECE8" },
  cat3: { label:"노동·인권·다양성", color:"#8A4F7D", bg:"#F0E6EE" },
  cat6: { label:"정치·역사", color:"#2C3E63", bg:"#E4E8F0" },
  cat2: { label:"문화·종교", color:"#B5473F", bg:"#F4E3DF" },
  cat4: { label:"스포츠", color:"#5F7A55", bg:"#E6ECDD" },

다. 전문성이나 성과를 과장하지 않고 정확한 정보와 존중을 바탕으로 활용하는 것이 중요합니다.","caution":"국제 교육의 날의 공식 취지와 사회적 맥락을 먼저 확인한 뒤, 기념일 명칭을 단순한 할인 명분으로 소비하지 않도록 합니다. 관련 인물·집단·상징을 희화화하거나 ‘공식·인증·후원’으로 오인시키는 표현을 피하고, 사실·통계·이미지·AI 생성물의 정확성과 권리관계를 게시 전에 함께 검수합니다.","note":"· ‘국제 교육의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"UNESCO - International Days","url":"https://www.unesco.org/en/days"}]}],"01-26":[{"cat":"cat5","title":"국제 청정에너지의 날","desc":"국제 청정에너지의 날은 환경보전과 지속가능성, 생태계 보호에 대한 인식을 높이기 위한 날입니다. 환경적 효익을 주장할 때는 구체적인 범위와 객관적 근거가 중요합니다.","caution":"국제 청정에너지의 날과 연계해 ‘친환경·에코·그린·탄소중립·무공해’ 등을 사용할 경우 청정에너지의 날과 실제 상품·사업의 관련성 및 객관적 근거를 확인합니다. 일부 친환경 요소를 제품 전체나 기업 전체의 성과로 확대하거나 자연 이미지·녹색 색상만으로 환경 우수성을 암시하는 그린워싱을 주의합니다.","note":"· ‘국제 청정에너지의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· ‘친환경·탄소중립·무공해’ 등 표현의 객관적 근거 확보\n· 일부 친환경 요소를 제품·기업 전체 성과로 확대하지 않기\n· 환경표지·인증마크 사용 자격과 유효범위 확인\n· 재활용·생분해·감축량 등 수치는 조건·산정기준 표시\n· 자연·녹색 이미지만으로 환경 우수성을 암시하지 않기\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"UN - International Days and Weeks","url":"https://www.un.org/en/observances/list-days-weeks"}]}],"01-27":[{"cat":"cat6","title":"UN 홀로코스트 희생자 추모의 날","desc":"제2차 세계대전 중 나치 독일과 협력 세력에 의해 희생된 홀로코스트 피해자를 기억하고 반유대주의·인종차별·혐오의 위험을 되새기는 국제 추모일입니다.","caution":"학살·수용소·나치 상징·피해자 이미지를 자극적 또는 상업적 소재로 사용하지 않고, 역사적 사실을 축소·왜곡·희화화하거나 특정 집단에 대한 혐오를 재생산하지 않도록 해야 합니다.","note":"· 홀로코스트 부정·축소·왜곡으로 읽힐 표현 금지\n· 나치 문양·제복·수용소 이미지를 장식·패션·밈 소재로 사용하지 않기\n· 피해자 사진·수용소 기록물을 상품 판매와 결합하지 않기\n· 유대인·특정 민족·종교에 대한 고정관념·혐오 표현 금지\n· 역사 통계·인용은 신뢰 가능한 자료로 사실관계 확인\n· 추모 문구를 할인·쿠폰·경품 메시지와 병치하지 않기\n· 영화·사진·기록물의 저작권과 맥락 확인\n· AI 생성 역사 이미지가 실제 기록물로 오인되지 않도록 검수","links":[{"label":"UN - International Days and Weeks","url":"https://www.un.org/en/observances/list-days-weeks"}]},{"cat":"cat6","title":"홀로코스트 희생자 추모의 날","desc":"제2차 세계대 ational Days and Weeks","url":"https://www.un.org/en/observances/list-days-weeks"}]}],"02-13":[{"cat":"cat2","title":"세계 라디오의 날","desc":"세계 라디오의 날은 지식·문화·미디어·표현의 자유 또는 창작자 권리와 관련된 기념일입니다. 콘텐츠를 활용할 때 저작권·상표권·초상권과 출처 표기를 특히 점검해야 합니다.","caution":"세계 라디오의 날 관련 콘텐츠에서는 언론·방송의 공익적 의미를 특정 매체나 기자에 대한 조롱·비방과 결합하지 않습니다. 기사·방송화면·신문 지면·사진을 광고 소재로 재사용할 경우 저작권·초상권·인용 요건과 광고성 오인 가능성을 확인합니다.","note":"· ‘세계 라디오의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"UNESCO - International Days","url":"https://www.unesco.org/en/days"}]}],"02-14":[{"cat":"cat1","title":"발렌타인데이","desc":"발렌타인데이은 대중문화·상업 프로모션과 밀접하게 활용되는 시즌성 일정입니다. 유머·관계·선물·할인 메시지를 사용할 때 소비자 오인, 차별적 고정관념, 과도한 구매 압박을 피하는 것이 중요합니다.","caution":"발렌타인데이 프로모션에서 연애·결혼 여부를 정상/비정상으로 나누거나 특정 성별이 선물을 해야 한다는 고정관념을 강화하지 않습니다. 초콜릿·과자 등 식품의 가격·구성·알레르기 정보를 정확히 표시하고, ‘고백 성공 보장’처럼 관계 결과를 단정하는 과장 카피도 피합니다.","note":"· ‘발렌타인데이’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"위키백과 - 발렌타인데이","url":"https://ko.wikipedia.org/wiki/발렌타인데이"}]},{"cat":"cat1","title":"밸런타인데이","desc":"밸런타인데이은 대중문화·상업 프로모션과 밀접하게 활용되는 시즌성 일정입니다. 유머·관계·선물·할인 메시지를 사용할 때 소비자 오인, 차별적 고정관념, 과도한 구매 압박을 피하는 것이 중요합니다.","caution":"밸런타인데이 프로모션에서 연애·결혼 여부를 정상/비정상으로 나누거나 특정 성별이 선물을 해야 한다는 고정관념을 강화하지 않습니다. 초콜릿·과자 등 식품의 가격·구성·알레르기 정보를 정확히 표시하고, ‘고백 성공 보장’처럼 관계 결과를 단정하는 과장 카피도 피합니다.","note":"· ‘밸런타인데이’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피  조건을 실제 충족하는지 확인합니다. 대표 이미지가 실제 구성·중량을 과장하지 않도록 하고, ‘국산·한우·유기농·무농약·지역특산’ 등 인증·원산지 표현은 증빙 범위와 일치시켜야 합니다.","note":"· ‘참치데이’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 제품명·원재료·함량·원산지와 광고문구 일치 확인\n· ‘국내산·지역명·유기농·무첨가’ 등 표현의 증빙 범위 확인\n· 질병 예방·치료 효과로 오인될 효능 표현 지양\n· 할인율·정상가·행사기간·수량 조건 명확히 표시\n· 조리·연출 이미지가 실제 구성·중량을 과장하지 않는지 확인\n· 알레르기·보관·섭취 관련 필수정보 누락 여부 확인\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"해양수산부 - 정책·보도자료","url":"https://www.mof.go.kr/"}]}],"03-08":[{"cat":"cat3","title":"UN 세계 여성의 날","desc":"UN 세계 여성의 날은 여성·여아의 권리와 평등, 차별·폭력 해소 또는 해당 분야에서의 참여 확대를 알리는 날입니다. 성별 고정관념을 재생산하지 않는 표현이 중요합니다.","caution":"UN 세계 여성의 날 관련 캠페인에서 여성을 외모·육아·가사·감성 등 제한된 역할로만 묘사하거나 ‘여성용=핑크’ 같은 성별 고정관념을 강화하지 않도록 합니다. 기업의 실제 제도·고용 관행과 동떨어진 평등 메시지는 ‘핑크워싱’ 비판을 받을 수 있어 근거를 확인합니다.","note":"· ‘UN 세계 여성의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 성별에 따른 외모·직업·가사·육아 역할 고정관념 주의\n· 여성의 날을 단순 ‘여성 고객 할인’로 축소하지 않기\n· 성적 대상화·외모 평가 중심 비주얼 지양\n· 기업의 실제 성평등 정책과 메시지의 정합성 확인\n· 통계·임금격차 수치는 기준연도와 출처 표시\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"UN 공식 페이지 - International Women's Day","url":"https://www.un.org/en/observances/womens-day"}]},{"cat":"cat6","title":"3·8민주의거 기념일","desc":"3·8민주의거 기념일은 대한민국의 민주주의·독립·항쟁 또는 역사적 희생을 기리는 국가기념일·역사 일정입니다. 사건의 역사적 맥락과 희생자를 존중하는 표현이 필요합니다.","caution":"3·8민주의거 기념일과 관련된 희생자·시위·진압·독립운동 장면을 유머·밈·판매 촉진 소재로 사용하지 않습니다. 날짜·숫자와 할인율을 결합할 때 역사적 사건을 희화화하는 중의성이 없는지 확인하고, 특정 정치세력의 현재적 지지·반대로 오인될 표현도 검수합니다.","note":"· ‘3·8민주의거 기념일’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 희생자·유가족·참여자의 사진·사연을 구매유도에 이용하지 않기\n· 폭력·진압·총기·포격 장면을 유머·밈으로 소비하지 않기\n· 사건 날짜·숫자를 할인율·쿠폰명과 결합할 때 의미 검토\n· 현재 정치세력 지지·반대로 오인될 표현 주의\n· 역사적 명칭·연도·사실관계는 공신력 있는 자료로 확인\n· AI 생성 역사 이미지의 시대·복식·상징 오류 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]},{"cat":"cat3","title":"세계 여성의 날","desc":"세계 여성의 날은 여성·여아의 권리와 평등, 차별·폭력 해소 또는 해당 분야에서의 참여 확대를 알리는 날입니다. 성별 고정관념을 재생산하지 않는 표현이 중요합니다.","caution":"세계 여성의 날 관련 캠페인에서 여성을 외모·육아·가사·감성 등 제한된 eks","url":"https://www.un.org/en/observances/list-days-weeks"}]}],"03-21":[{"cat":"cat3","title":"세계 다운증후군의 날","desc":"세계 다운증후군의 날은 장애인의 권리·사회참여·접근성과 차별 해소의 중요성을 알리는 날입니다. 장애를 동정이나 극복 서사로만 다루지 않고 당사자의 존엄과 선택권을 존중해야 합니다.","caution":"세계 다운증후군의 날 관련 광고에서는 장애인을 ‘불쌍함’, ‘극복의 기적’, ‘영웅’이라는 단일 서사로 소비하지 않습니다. 장애를 비유적 부정어로 쓰거나 비장애인 관점의 체험 이벤트로 단순화하지 말고, 접근성·자막·대체텍스트 등 실제 이용 환경도 함께 점검합니다.","note":"· ‘세계 다운증후군의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 장애를 ‘극복해야 할 비극’ 또는 감동 소재로만 표현하지 않기\n· 장애 관련 비하어·관용표현 사용 여부 검수\n· 당사자 이미지·사례 사용 시 존엄·초상권·동의 고려\n· 웹·영상·오프라인 행사 접근성 실제 제공 여부 확인\n· 비장애인 체험을 장애인의 삶 전체로 일반화하지 않기\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"UN - International Days and Weeks","url":"https://www.un.org/en/observances/list-days-weeks"}]},{"cat":"cat5","title":"세계 산림의 날","desc":"세계 산림의 날은 환경보전과 지속가능성, 생태계 보호에 대한 인식을 높이기 위한 날입니다. 환경적 효익을 주장할 때는 구체적인 범위와 객관적 근거가 중요합니다.","caution":"세계 산림의 날과 연계해 ‘친환경·에코·그린·탄소중립·무공해’ 등을 사용할 경우 산림의 날과 실제 상품·사업의 관련성 및 객관적 근거를 확인합니다. 일부 친환경 요소를 제품 전체나 기업 전체의 성과로 확대하거나 자연 이미지·녹색 색상만으로 환경 우수성을 암시하는 그린워싱을 주의합니다.","note":"· ‘세계 산림의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· ‘친환경·탄소중립·무공해’ 등 표현의 객관적 근거 확보\n· 일부 친환경 요소를 제품·기업 전체 성과로 확대하지 않기\n· 환경표지·인증마크 사용 자격과 유효범위 확인\n· 재활용·생분해·감축량 등 수치는 조건·산정기준 표시\n· 자연·녹색 이미지만으로 환경 우수성을 암시하지 않기\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"UN - International Days and Weeks","url":"https://www.un.org/en/observances/list-days-weeks"}]},{"cat":"cat3","title":"세계 인종차별 철폐의 날","desc":"세계 인종차별 철폐의 날은 차별·폭력·불평등을 줄이고 인권·평화·민주적 가치를 확산하기 위한 기념일입니다. 특정 집단이나 국가를 단순화하지 않는 균형 있는 표현이 필요합니다.","caution":"세계 인종차별 철폐의 날의 공식 취지와 사회적 맥락을 먼저 확인한 뒤, 기념일 명칭을 단순한 할인 명분으로 소비하지 않도록 합니다. 관련 인물·집단·상징을 희화화하거나 ‘공식·인증·후원’으로 오인시키는 표현을 피하고, 사실·통계·이미지·AI 생성물의 정확성과 권리관계를 게시 전에 함께 검수합니다.","note":"· ‘세계 인종차별 철폐의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 명 기념일","desc":"4·19혁명 기념일은 대한민국의 민주주의·독립·항쟁 또는 역사적 희생을 기리는 국가기념일·역사 일정입니다. 사건의 역사적 맥락과 희생자를 존중하는 표현이 필요합니다.","caution":"4·19혁명 기념일과 관련된 희생자·시위·진압·독립운동 장면을 유머·밈·판매 촉진 소재로 사용하지 않습니다. 날짜·숫자와 할인율을 결합할 때 역사적 사건을 희화화하는 중의성이 없는지 확인하고, 특정 정치세력의 현재적 지지·반대로 오인될 표현도 검수합니다.","note":"· ‘4·19혁명 기념일’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 희생자·유가족·참여자의 사진·사연을 구매유도에 이용하지 않기\n· 폭력·진압·총기·포격 장면을 유머·밈으로 소비하지 않기\n· 사건 날짜·숫자를 할인율·쿠폰명과 결합할 때 의미 검토\n· 현재 정치세력 지지·반대로 오인될 표현 주의\n· 역사적 명칭·연도·사실관계는 공신력 있는 자료로 확인\n· AI 생성 역사 이미지의 시대·복식·상징 오류 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]}],"04-20":[{"cat":"cat3","title":"장애인의 날","desc":"장애인의 날은 장애인의 권리·사회참여·접근성과 차별 해소의 중요성을 알리는 날입니다. 장애를 동정이나 극복 서사로만 다루지 않고 당사자의 존엄과 선택권을 존중해야 합니다.","caution":"장애인의 날 관련 광고에서는 장애인을 ‘불쌍함’, ‘극복의 기적’, ‘영웅’이라는 단일 서사로 소비하지 않습니다. 장애를 비유적 부정어로 쓰거나 비장애인 관점의 체험 이벤트로 단순화하지 말고, 접근성·자막·대체텍스트 등 실제 이용 환경도 함께 점검합니다.","note":"· ‘장애인의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 장애를 ‘극복해야 할 비극’ 또는 감동 소재로만 표현하지 않기\n· 장애 관련 비하어·관용표현 사용 여부 검수\n· 당사자 이미지·사례 사용 시 존엄·초상권·동의 고려\n· 웹·영상·오프라인 행사 접근성 실제 제공 여부 확인\n· 비장애인 체험을 장애인의 삶 전체로 일반화하지 않기\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]}],"04-21":[{"cat":"cat2","title":"과학의 날","desc":"과학의 날은 교육·과학·기술·지식의 가치와 해당 분야 종사자의 역할을 알리는 날입니다. 전문성이나 성과를 과장하지 않고 정확한 정보와 존중을 바탕으로 활용하는 것이 중요합니다.","caution":"과학의 날의 공식 취지와 사회적 맥락을 먼저 확인한 뒤, 기념일 명칭을 단순한 할인 명분으로 소비하지 않도록 합니다. 관련 인물·집단·상징을 희화화하거나 ‘공식·인증·후원’으로 오인시키는 표현을 피하고, 사실·통계·이미지·AI 생성물의 정확성과 권리관계를 게시 전에 함께 검수합니다.","note":"· ‘과학의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]}], 재 (1999)","desc":"1999년 6월 30일 경기도 화성 씨랜드 청소년수련원에서 발생한 화재로 어린이를 포함한 다수의 희생자가 발생한 참사입니다.","caution":"어린이 희생이 포함된 참사인 만큼 화재·캠프·수련원·불꽃을 유머나 이벤트 소재로 사용하는 데 특히 신중해야 합니다. 희생자·유가족의 기억을 상품 홍보와 연결하거나 자극적인 화재 이미지를 재현하지 않습니다.","note":"· 불꽃·캠프파이어·화재 이미지를 자극적 프로모션 소재로 사용하지 않기\n· 어린이 희생자를 동정·공포 마케팅에 이용하지 않기\n· ‘6·30/0630’ 숫자 프로모션의 중의성 검토\n· ‘불타는 할인·화끈한 밤’ 등 화재 연상 카피 주의\n· 수련원·캠핑 상품 프로모션은 당일 맥락 추가 검토\n· 안전 캠페인은 예방·대피정보 중심으로 구성\n· 기록사진·뉴스영상·희생자 사진 권리 확인\n· AI 생성 화재·아동 이미지의 선정성·오인 가능성 검수","links":[{"label":"위키백과 - 씨랜드 청소년수련원 화재","url":"https://ko.wikipedia.org/wiki/씨랜드_청소년수련원_화재"}]}],"07-05":[{"cat":"cat1","title":"추어데이","desc":"추어데이은 특정 식품·농축수산물의 소비 촉진 또는 인지도 제고와 연결되는 기념일입니다. 상품 홍보 시 원산지·품종·함량·인증·가격 등 소비자 선택에 영향을 주는 정보의 정확성이 중요합니다.","caution":"추어데이 프로모션에서는 행사 대상 상품이 해당 원재료·축종·품종·원산지 조건을 실제 충족하는지 확인합니다. 대표 이미지가 실제 구성·중량을 과장하지 않도록 하고, ‘국산·한우·유기농·무농약·지역특산’ 등 인증·원산지 표현은 증빙 범위와 일치시켜야 합니다.","note":"· ‘추어데이’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 제품명·원재료·함량·원산지와 광고문구 일치 확인\n· ‘국내산·지역명·유기농·무첨가’ 등 표현의 증빙 범위 확인\n· 질병 예방·치료 효과로 오인될 효능 표현 지양\n· 할인율·정상가·행사기간·수량 조건 명확히 표시\n· 조리·연출 이미지가 실제 구성·중량을 과장하지 않는지 확인\n· 알레르기·보관·섭취 관련 필수정보 누락 여부 확인\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"해양수산부 - 정책·보도자료","url":"https://www.mof.go.kr/"}]}],"07-08":[{"cat":"cat6","title":"방위산업의 날","desc":"방위산업의 날은 노동·산업·직업 또는 해당 산업 분야의 사회적 기여와 안전·권익을 돌아보는 기념일입니다. 종사자를 단순한 홍보 소재로 소비하지 않고 실제 근로환경·안전과 일치하는 메시지가 필요합니다.","caution":"방위산업의 날의 공식 취지와 사회적 맥락을 먼저 확인한 뒤, 기념일 명칭을 단순한 할인 명분으로 소비하지 않도록 합니다. 관련 인물·집단·상징을 희화화하거나 ‘공식·인증·후원’으로 오인시키는 표현을 피하고, 사실·통계·이미지·AI 생성물의 정확성과 권리관계를 게시 전에 함께 검수합니다.","note":"· ‘방위산업의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]}],"07-11":[{"cat":"cat2","title":"세계 인구의 날","desc":"세 l":"UNESCO - International Days","url":"https://www.unesco.org/en/days"}]}],"09-09":[{"cat":"cat2","title":"숙련기술인의 날","desc":"숙련기술인의 날은 노동·산업·직업 또는 해당 산업 분야의 사회적 기여와 안전·권익을 돌아보는 기념일입니다. 종사자를 단순한 홍보 소재로 소비하지 않고 실제 근로환경·안전과 일치하는 메시지가 필요합니다.","caution":"숙련기술인의 날의 공식 취지와 사회적 맥락을 먼저 확인한 뒤, 기념일 명칭을 단순한 할인 명분으로 소비하지 않도록 합니다. 관련 인물·집단·상징을 희화화하거나 ‘공식·인증·후원’으로 오인시키는 표현을 피하고, 사실·통계·이미지·AI 생성물의 정확성과 권리관계를 게시 전에 함께 검수합니다.","note":"· ‘숙련기술인의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]},{"cat":"cat1","title":"구구데이","desc":"구구데이은 특정 식품·농축수산물의 소비 촉진 또는 인지도 제고와 연결되는 기념일입니다. 상품 홍보 시 원산지·품종·함량·인증·가격 등 소비자 선택에 영향을 주는 정보의 정확성이 중요합니다.","caution":"구구데이 프로모션에서는 행사 대상 상품이 해당 원재료·축종·품종·원산지 조건을 실제 충족하는지 확인합니다. 대표 이미지가 실제 구성·중량을 과장하지 않도록 하고, ‘국산·한우·유기농·무농약·지역특산’ 등 인증·원산지 표현은 증빙 범위와 일치시켜야 합니다.","note":"· ‘구구데이’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"농림축산식품부 - 정책·보도자료","url":"https://www.mafra.go.kr/"}]},{"cat":"cat5","title":"귀의 날","desc":"귀의 날은 해당 주제의 사회적 의미와 인식을 높이기 위해 기념하거나 활용되는 일정입니다. 공식 명칭·취지·주관기관 및 최신 사실관계를 확인하고 본래 의미에 맞게 커뮤니케이션해야 합니다.","caution":"귀의 날의 공식 취지와 사회적 맥락을 먼저 확인한 뒤, 기념일 명칭을 단순한 할인 명분으로 소비하지 않도록 합니다. 관련 인물·집단·상징을 희화화하거나 ‘공식·인증·후원’으로 오인시키는 표현을 피하고, 사실·통계·이미지·AI 생성물의 정확성과 권리관계를 게시 전에 함께 검수합니다.","note":"· ‘귀의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상 주의·독립·항쟁 또는 역사적 희생을 기리는 국가기념일·역사 일정입니다. 사건의 역사적 맥락과 희생자를 존중하는 표현이 필요합니다.","caution":"학생독립운동 기념일과 관련된 희생자·시위·진압·독립운동 장면을 유머·밈·판매 촉진 소재로 사용하지 않습니다. 날짜·숫자와 할인율을 결합할 때 역사적 사건을 희화화하는 중의성이 없는지 확인하고, 특정 정치세력의 현재적 지지·반대로 오인될 표현도 검수합니다.","note":"· ‘학생독립운동 기념일’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 희생자·유가족·참여자의 사진·사연을 구매유도에 이용하지 않기\n· 폭력·진압·총기·포격 장면을 유머·밈으로 소비하지 않기\n· 사건 날짜·숫자를 할인율·쿠폰명과 결합할 때 의미 검토\n· 현재 정치세력 지지·반대로 오인될 표현 주의\n· 역사적 명칭·연도·사실관계는 공신력 있는 자료로 확인\n· AI 생성 역사 이미지의 시대·복식·상징 오류 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]}],"11-04":[{"cat":"cat3","title":"한글 점자의 날","desc":"한글 점자의 날은 시각장애인의 문자 접근권과 점자의 중요성을 알리는 날입니다. 정보 접근성·독립적인 의사소통·포용적 환경의 의미를 함께 살피는 것이 중요합니다.","caution":"한글 점자의 날 관련 콘텐츠에서는 점자를 장식무늬처럼 임의 배열하거나 의미 없는 점을 ‘점자’로 표현하지 않도록 합니다. 시각장애인을 동정·의존적 이미지로만 묘사하지 말고, 실제 디지털·오프라인 접근성이 뒷받침되지 않은 채 ‘배리어프리’를 과장하는 표현도 주의합니다.","note":"· ‘한글 점자의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 실제 점자 문구를 사용할 경우 점 배열과 의미를 전문가·당사자 관점에서 확인\n· 점자를 단순 장식 패턴이나 암호처럼 사용하지 않기\n· 시각장애인을 동정·시혜의 대상으로 묘사하지 않기\n· 이미지 중심 콘텐츠에는 대체텍스트 등 접근성 고려\n· ‘배리어프리·접근 가능’ 표현은 실제 서비스 수준과 일치시킬 것\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]}],"11-05":[{"cat":"cat1","title":"소상공인의 날","desc":"소상공인의 날은 노동·산업·직업 또는 해당 산업 분야의 사회적 기여와 안전·권익을 돌아보는 기념일입니다. 종사자를 단순한 홍보 소재로 소비하지 않고 실제 근로환경·안전과 일치하는 메시지가 필요합니다.","caution":"소상공인의 날의 공식 취지와 사회적 맥락을 먼저 확인한 뒤, 기념일 명칭을 단순한 할인 명분으로 소비하지 않도록 합니다. 관련 인물·집단·상징을 희화화하거나 ‘공식·인증·후원’으로 오인시키는 표현을 피하고, 사실·통계·이미지·AI 생성물의 정확성과 권리관계를 게시 전에 함께 검수합니다.","note":"· ‘소상공인의 날’의 공식 명칭·날짜·주관기관 또는 법적 지위 확인\n· 기념일의 본래 취지와 무관한 과도한 상업화 지양\n· 관련 집단·직업·문화에 대한 고정관념·비하 표현 검수\n· ‘공식·인증·후원·파트너’로 오인될 표현 사용 주의\n· 통계·수치·역사적 사실은 최신 출처와 기준 확인\n· 이미지·음원·폰트·영상·로고의 저작권·상표권 확인\n· AI 생성 카피·이미지의 사실오류·편향·권리침해 검수\n· 날짜 × 상품명 × 카피 × 이미지 × 숫자 조합을 최종 게시 전 통합 검수","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정" function pad(n){ return n<10 ? "0"+n : ""+n; }


// ===== 사용자 제공 기념일 표 추가 데이터 =====
// 동일한 (카테고리+날짜+기념일명)은 1회만 추가되며,
// 날짜가 같아도 기념일명이 다르면 각각 별도 이벤트로 표시됩니다.
const USER_ADDED_EVENTS = [];
function mergeUserAddedEvents(){
  USER_ADDED_EVENTS.forEach(item => {
    if(!EVENTS[item.date]) EVENTS[item.date] = [];

    // 동일 기념일(같은 카테고리·날짜·명칭)은 중복 추가하지 않음
    const duplicated = EVENTS[item.date].some(e =>
      e.cat === item.cat && e.title === item.title
    );
    if(!duplicated){
      EVENTS[item.date].push({
        cat:item.cat,
        title:item.title,
        desc:item.desc,
        caution:item.caution
      });
    }
  });
}

mergeUserAddedEvents();


function renderLegend(){
  const el = document.getElementById("legend");
  el.innerHTML = "";
  Object.entries(CATS).forEach(([key, c])=>{
    const chip = document.createElement("div");
    chip.className = "chip" + (selectedCat === key ? " selected" : "");
    chip.innerHTML = `<span class="dot" style="background:${c.color}"></span>${c.label}`;
    chip.onclick = ()=>{
      if(selectedCat === key){
        selectedCat = null;
        hideCategoryPanel();
      }else{
        selectedCat = key;
        showCategoryPanel(key);
      }
      renderLegend();
    };
    el.appendChild(chip);
  });
}

function renderMonthNav(){
  const el = document.getElementById("monthnav");
  el.innerHTML = "";
  MONTH_NAMES.forEach((name, i)=>{
    const btn = document.createElement("button");
    btn.className = "mbtn" + (activeMonth === i+1 ? " active" : "");
    btn.textContent = name;
    btn.onclick = ()=>{ activeMonth = i+1; renderMonthNav(); renderCalendar(); };
    el.appendChild(btn);
  });
}

function getCategoryEvents(catKey){
  const result = [];
  Object.entries(EVENTS).forEach(([key, events])=>{
    events.forEach(event=>{
      if(event.cat === catKey){
        result.push({key, event});
      }
    });
  });
  result.sort((a,b)=>a.key.localeCompare(b.key));
  return result;
}

function showCategoryPanel(catKey){
  const panel = document.getElementById("catPanel");
  const title = document.getElementById("catPanelTitle");
  const count = document.getElementById("catPanelCount");
  const list = document.getElementById("catList");
  const cat = CATS[catKey];
  const items = getCategoryEvents(catKey);

  title.textContent = cat.label;
  count.textContent = `총 ${items.length}개`;
  list.innerHTML = "";

  items.forEach(({key, event})=>{
    const [mm, dd] = key.split("-");
    const item = document.createElement("button");
    item.type = "button";
    item.className = "cat-item";
    item.innerHTML = `
      <span class="cat-date">${parseInt(mm)}월 ${parseInt(dd)}일</span>
      <span class="cat-dot" style="background:${cat.color}"></span>
      <span class="cat-name">${event.title}</span>
      <span class="cat-arrow">›</span>
    `;
    item.onclick = ()=> openModal(key, [event]);
    list.appendChild(item);
  });

  panel.classList.add("show");
}

function hideCategoryPanel(){
  document.getElementById("catPanel").classList.remove("show");
}

function renderCalendar(){
  document.getElementById("calTitle").textContent = `${YEAR}년 ${MONTH_NAMES[activeMonth-1]}`;
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  WD.forEach((w,i)=>{
    const wd = document.createElement("div");
    wd.className = "wd" + (i===0?" sun":i===6?" sat":"");
    wd.textContent = w;
    grid.appendChild(wd);
  });

  const firstDay = new Date(YEAR, activeMonth-1, 1).getDay();
  const daysInMonth = new Date(YEAR, activeMonth, 0).getDate();

  for(let i=0;i<firstDay;i++){
    const empty = document.createElement("div");
    empty.className = "cell empty";
    grid.appendChild(empty);
  }

  for(let d=1; d<=daysInMonth; d++){
    const dow = new Date(YEAR, activeMonth-1, d).getDay();
    const key = pad(activeMonth) + "-" + pad(d);
    const allEvents = EVENTS[key] || [];
    const events = allEvents;
    const isToday = (YEAR===2026 && activeMonth===9 && d===8);

    const cell = document.createElement("div");
    cell.className = "cell" + (dow===0?" sun":dow===6?" sat":"") + (isToday?" today":"") + (events.length? " clickable":"");

    const num = document.createElement("div");
    num.className = "daynum";
    num.textContent = d;
    cell.appendChild(num);

    if(events.length){
      const eventList = document.createElement("div");
      eventList.className = "dots";
      eventList.style.cssText = "display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden;";

      const visibleEvents = events.slice(0, 4);
      visibleEvents.forEach(e=>{
        const row = document.createElement("div");
        row.style.cssText = "display:flex;align-items:center;gap:5px;width:100%;min-width:0;height:18px;line-height:18px;overflow:hidden;";

        const dot = document.createElement("span");
        dot.className = "dot";
        dot.style.background = CATS[e.cat].color;
        dot.style.flex = "0 0 auto";

        const label = document.createElement("span");
        label.className = "ev-label";
        label.style.cssText = "margin:0;flex:1 1 auto;min-width:0;width:0;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:18px;";
        label.textContent = e.title;

        row.appendChild(dot);
        row.appendChild(label);
        eventList.appendChild(row);
      });

      if(events.length > 4){
        const more = document.createElement("div");
        more.className = "more-events";
        more.textContent = `+ ${events.length - 4}개 더보기`;
        more.style.cssText = "height:16px;line-height:16px;padding-left:14px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;";
        eventList.appendChild(more);
      }

      cell.appendChild(eventList);

      cell.onclick = ()=> openModal(key, events);
    }

    grid.appendChild(cell);
  }

  const totalCells = firstDay + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for(let i=0;i<trailing;i++){
    const empty = document.createElement("div");
    empty.className = "cell empty";
    grid.appendChild(empty);
  }
}


function escCheckText(v){
  return String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function renderCheckList(note){
  let raw=String(note ?? '').replace(/\r\n?/g,'\n').trim();
  if(!raw || raw==="#N/A") return '<p class="ev-sec-text">등록된 체크사항이 없습니다.</p>';
  raw=raw.replace(/<br\s*\/?>/gi,'\n');
  let parts=raw.split(/(?:^|\n)\s*·\s*/).filter(Boolean);
  if(parts.length<=1 && raw.includes('·')) parts=raw.split(/\s*·\s*/).filter(Boolean);
  if(!parts.length) parts=[raw];
  return '<ul class="check-list ev-sec-text">'+parts.map(p =>
    '<li class="check-item"><span>·</span><span>'+escCheckText(p.trim()).replace(/\n+/g,' ')+'</span></li>'
  ).join('')+'</ul>';
}

function openModal(key, events){
  const [mm, dd] = key.split("-");
  document.getElementById("modalDate").textContent = `${YEAR}년 ${parseInt(mm)}월 ${parseInt(dd)}일`;
  const body = document.getElementById("modalBody");
  body.innerHTML = "";
  events.forEach(e=>{
    const c = CATS[e.cat];
    const links = e.links || [];
    const refHtml = links.length
      ? `<ul class="ref-list">${links.map(l=>`<li><a href="${l.url}" target="_blank" rel="noopener noreferrer">${l.label}</a></li>`).join("")}</ul>`
      : `<div class="ref-empty">등록된 참고자료가 없습니다. links 필드에 추가해보세요.</div>`;
    const card = document.createElement("div");
    card.className = "ev-card";
    card.innerHTML = `
      <span class="badge" style="background:${c.bg};color:${c.color}">${c.label}</span>
      <div class="ev-title">${e.title}</div>
      <div class="ev-sec-label">개념 · 설명</div>
      <p class="ev-sec-text">${e.desc}</p>
      <div class="ev-sec-label">마케팅 시 주의할 점</div>
      <div class="caution-box"><p class="ev-sec-text">${e.caution}</p></div>
      <div class="ev-sec-label" style="margin-top:12px;">체크사항</div>
      <div class="caution-box">${renderCheckList(e.note)}</div>
      <div class="ev-sec-label" style="margin-top:12px;">참고자료</div>
      <div class="ref-box">${refHtml}</div>
    `;
    body.appendChild(card);
  });
  document.getElementById("overlay").classList.add("show");
}

function closeModal(){
  document.getElementById("overlay").classList.remove("show");
}

document.getElementById("closeBtn").onclick = closeModal;
document.getElementById("overlay").onclick = (e)=>{ if(e.target.id==="overlay") closeModal(); };
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeModal(); });

renderLegend();
renderMonthNav();
renderCalendar();
