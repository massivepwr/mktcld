<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026년 이슈관리 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEBE3;
    --card:#FBFAF6;
    --ink:#232620;
    --ink-soft:#5B5A52;
    --line:#D8D5C9;

    --c-consumer:#A9791F;
    --c-consumer-bg:#F1E7CF;
    --c-safety:#3F6B5B;
    --c-safety-bg:#E4EEE9;
    --c-rights:#8A4F7D;
    --c-rights-bg:#F1E5EE;
    --c-history:#2C3E63;
    --c-history-bg:#E4E8F0;
    --c-culture:#B5473F;
    --c-culture-bg:#F4E3DF;
    --c-sports:#5F7A55;
    --c-sports-bg:#E6ECDD;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    padding:28px 16px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;}

  /* header */
  .head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
    border-bottom:2px solid var(--ink);
    padding-bottom:18px;
    margin-bottom:20px;
  }
  .head h1{
    font-family:'Noto Serif KR', serif;
    font-weight:700;
    font-size:34px;
    line-height:1.15;
    margin:0;
  }
  .head h1 small{
    display:block;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:500;
    font-size:14px;
    color:var(--ink-soft);
    margin-top:6px;
    letter-spacing:.02em;
  }
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    max-width:420px;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    padding:5px 10px 5px 8px;
    border-radius:100px;
    border:1px solid var(--line);
    background:var(--card);
    cursor:pointer;
    user-select:none;
    transition:opacity .15s ease, transform .1s ease;
    color:var(--ink);
    line-height:1.2;
  }
  .chip:active{transform:scale(0.97);}
  .chip.off{opacity:.35;}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;}

  /* month nav */
  .monthnav{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:18px;
  }
  .mbtn{
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink-soft);
    font-family:'Noto Sans KR', sans-serif;
    font-size:13.5px;
    font-weight:500;
    padding:7px 12px;
    border-radius:8px;
    cursor:pointer;
  }
  .mbtn.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
    font-weight:700;
  }

  /* calendar */
  .cal-title{
    font-family:'Noto Serif KR', serif;
    font-size:22px;
    font-weight:700;
    margin:6px 0 12px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(7, minmax(0,1fr));
    gap:6px;
    width:100%;
  }
  .wd{
    text-align:center;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    padding-bottom:4px;
  }
  .wd.sun{color:#B5473F;}
  .wd.sat{color:#2C3E63;}
  .cell{
    min-height:78px;
    min-width:0;
    width:100%;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 6px 8px;
    position:relative;
    overflow:hidden;
  }
  .cell.empty{background:transparent;border-color:transparent;}
  .cell.clickable{cursor:pointer;}
  .cell.clickable:hover{border-color:var(--ink);}
  .cell.today{outline:2px solid var(--ink);outline-offset:-2px;}
  .daynum{
    font-size:13px;
    font-weight:700;
    color:var(--ink);
  }
  .cell.sun .daynum{color:#B5473F;}
  .cell.sat .daynum{color:#2C3E63;}
  .dots{
    display:flex;
    flex-wrap:wrap;
    gap:3px;
    margin-top:6px;
  }
  .ev-label{
    font-size:10.5px;
    line-height:1.3;
    color:var(--ink);
    margin-top:4px;
    display:block;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .note{
    margin-top:22px;
    font-size:12.5px;
    color:var(--ink-soft);
    border-top:1px solid var(--line);
    padding-top:14px;
    line-height:1.6;
  }

  /* category event list */
  .cat-panel{
    display:none;
    margin:8px 0 22px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .cat-panel.show{display:block;}
  .cat-panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:15px 17px;
    border-bottom:1px solid var(--line);
  }
  .cat-panel-title{
    font-family:'Noto Serif KR', serif;
    font-size:18px;
    font-weight:700;
    margin:0;
  }
  .cat-panel-count{
    font-size:11.5px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .cat-list{padding:6px 10px 10px;}
  .cat-item{
    display:grid;
    grid-template-columns:88px 10px minmax(0,1fr) 18px;
    align-items:center;
    gap:9px;
    width:100%;
    border:0;
    border-bottom:1px solid var(--line);
    background:transparent;
    padding:12px 7px;
    text-align:left;
    color:var(--ink);
    cursor:pointer;
    font-family:'Noto Sans KR', sans-serif;
  }
  .cat-item:last-child{border-bottom:0;}
  .cat-item:hover{background:var(--paper);}
  .cat-date{
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .cat-dot{
    width:8px;height:8px;border-radius:50%;
  }
  .cat-name{
    min-width:0;
    font-size:13.5px;
    font-weight:700;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .cat-arrow{
    font-size:18px;
    color:var(--ink-soft);
    text-align:center;
  }
  .cat-empty{
    padding:18px 10px;
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
  }
  .chip.selected{
    border-color:var(--ink);
    box-shadow:0 0 0 1px var(--ink) inset;
  }

  /* modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(35,38,32,.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--card);
    max-width:460px;
    width:100%;
    max-height:82vh;
    overflow-y:auto;
    border-radius:14px;
    padding:22px 22px 20px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .modal-date{
    font-family:'Noto Serif KR', serif;
    font-size:20px;
    font-weight:700;
    margin:0 0 14px;
  }
  .ev-card{
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 15px;
    margin-bottom:12px;
  }
  .ev-card:last-child{margin-bottom:0;}
  .badge{
    display:inline-block;
    font-size:11.5px;
    font-weight:700;
    padding:3px 9px;
    border-radius:100px;
    margin-bottom:8px;
  }
  .ev-title{
    font-size:16.5px;
    font-weight:700;
    margin:0 0 10px;
  }
  .ev-sec-label{
    font-size:11.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:3px;
  }
  .ev-sec-text{
    font-size:13.5px;
    line-height:1.6;
    margin:0 0 10px;
  }
  .caution-box{
    background:var(--paper);
    border-radius:8px;
    padding:10px 12px;
    margin-top:2px;
  }
  .caution-box .ev-sec-text{margin-bottom:0;}
  .ref-box{
    margin-top:12px;
  }
  .ref-list{
    list-style:none;
    margin:0;
    padding:0;
  }
  .ref-list li{
    margin-bottom:5px;
  }
  .ref-list a{
    font-size:13px;
    color:var(--c-hist);
    text-decoration:none;
    border-bottom:1px solid currentColor;
  }
  .ref-list a:hover{opacity:.7;}
  .ref-empty{
    font-size:12.5px;
    color:var(--ink-soft);
    font-style:italic;
  }
  .close-btn{
    display:block;
    margin:16px auto 0;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:9px 20px;
    border-radius:8px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
  }

  @media (max-width:520px){
    .cat-item{grid-template-columns:76px 9px minmax(0,1fr) 16px;padding:11px 5px;}
    .cat-name{font-size:13px;}

    .cell{min-height:64px;}
    .ev-label{display:none;}
    .head h1{font-size:27px;}
  }
</style>

<style>
/* 사용자 제공 기념일 병합 표시 */
.cat-panel-note{
  margin-top:6px;
  font-size:12px;
  color:#6b7280;
}
</style>

<style id="vertical-event-layout">.dots{display:flex!important;flex-direction:column!important;align-items:flex-start!important;gap:4px!important;margin-top:5px!important}.dots .dot{width:10px!important;height:10px!important;min-width:10px!important;border-radius:50%!important;display:block!important}.ev-label{display:block!important;margin-top:2px!important;font-size:11px!important;line-height:15px!important;white-space:normal!important;overflow:hidden!important;text-overflow:ellipsis!important;word-break:keep-all!important}.cell:has(.dots){cursor:pointer!important}.cell:has(.dots):hover{background:rgba(0,0,0,.025)!important}@media(max-width:720px){.dots{gap:3px!important}.dots .dot{width:8px!important;height:8px!important}.ev-label{font-size:10px!important;line-height:13px!important}}</style>
<style id="calendar-uniform-layout">
/* 모든 날짜 셀의 가로/세로 크기를 균일하게 유지 */
.calendar-grid{
  grid-template-columns:repeat(7,minmax(0,1fr)) !important;
  grid-auto-rows:112px !important;
  align-items:stretch !important;
}
.day{
  min-width:0 !important;
  min-height:0 !important;
  height:112px !important;
  box-sizing:border-box !important;
  overflow:hidden !important;
  display:flex !important;
  flex-direction:column !important;
  padding:7px 6px !important;
}
.day.empty{
  height:112px !important;
}
.day-num{
  flex:0 0 auto !important;
  margin-bottom:4px !important;
  line-height:20px !important;
}
.day-events{
  flex:1 1 auto !important;
  min-height:0 !important;
  display:flex !important;
  flex-direction:column !important;
  align-items:stretch !important;
  justify-content:flex-start !important;
  gap:2px !important;
  margin-top:0 !important;
  overflow:hidden !important;
}
.event-pill{
  flex:0 0 19px !important;
  height:19px !important;
  min-height:19px !important;
  max-height:19px !important;
  box-sizing:border-box !important;
  padding:0 2px !important;
  gap:5px !important;
  overflow:hidden !important;
  line-height:19px !important;
}
.event-pill .event-dot{
  flex:0 0 9px !important;
  width:9px !important;
  height:9px !important;
  min-width:9px !important;
  max-width:9px !important;
}
.event-pill .event-name{
  display:block !important;
  flex:1 1 auto !important;
  min-width:0 !important;
  max-width:100% !important;
  overflow:hidden !important;
  text-overflow:ellipsis !important;
  white-space:nowrap !important;
  word-break:normal !important;
  overflow-wrap:normal !important;
  font-size:11px !important;
  line-height:19px !important;
  height:19px !important;
  max-height:19px !important;
}

/* 화면이 작아져도 셀 비율을 유지 */
@media (max-width:720px){
  .calendar-grid{grid-auto-rows:92px !important;}
  .day,.day.empty{height:92px !important;padding:6px 4px !important;}
  .day-num{line-height:18px !important;margin-bottom:3px !important;}
  .event-pill{
    flex-basis:17px !important;
    height:17px !important;
    min-height:17px !important;
    max-height:17px !important;
    gap:4px !important;
  }
  .event-pill .event-dot{
    width:8px !important;height:8px !important;
    min-width:8px !important;max-width:8px !important;
  }
  .event-pill .event-name{
    font-size:10px !important;
    line-height:17px !important;
    height:17px !important;
    max-height:17px !important;
  }
}
@media (max-width:520px){
  .calendar-grid{grid-auto-rows:82px !important;}
  .day,.day.empty{height:82px !important;padding:5px 3px !important;}
  .event-pill{
    flex-basis:16px !important;
    height:16px !important;
    min-height:16px !important;
    max-height:16px !important;
    gap:3px !important;
  }
  .event-pill .event-name{
    font-size:9px !important;
    line-height:16px !important;
    height:16px !important;
    max-height:16px !important;
  }
}
</style>


<style id="four-event-display-fix">
/* Calendar cell stability */
.calendar-grid, .calendar {
  min-width: 0;
}

.cell {
  min-width: 0 !important;
  box-sizing: border-box !important;
  overflow: hidden !important;
}

.dots {
  min-width: 0 !important;
  max-width: 100% !important;
  overflow: hidden !important;
}

.ev-label {
  min-width: 0 !important;
  width: 0 !important;
  display: block !important;
  white-space: nowrap !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
}

.more-events {
  color: #666;
}
</style>


<style id="caution-linebreak-support">
  .caution-text, .caution, [data-caution] {
    white-space: pre-line !important;
  }
</style>





<style id="caution-auto-hanging-final">
.caution-box .ev-sec-text{
  white-space:normal !important;
  margin:0;
}
.caution-summary{
  line-height:1.65;
  margin:0;
}
.caution-gap{
  height:.85em;
}
.caution-item{
  display:grid;
  grid-template-columns:.85em minmax(0,1fr);
  column-gap:.18em;
  align-items:start;
  margin:.22em 0;
  line-height:1.65;
}
.caution-dot{
  grid-column:1;
  text-align:left;
  font-weight:700;
}
.caution-item-text{
  grid-column:2;
  min-width:0;
  overflow-wrap:break-word;
  word-break:keep-all;
}
</style>





<style id="calendar-font-unify-final">
/* 6개 카테고리 글씨체(Noto Sans KR)를 전체 기준으로 통일 */
html, body, button, input, select, textarea,
#app, #app *, .calendar, .calendar *,
.modal, .modal *, .popup, .popup * {
  font-family: "Noto Sans KR", "Malgun Gothic", sans-serif !important;
}

/* 제목/연월도 카테고리와 동일한 글씨체 */
h1, h2, h3, .cal-title, .cat-panel-title,
[class*="title"], [class*="month"], [class*="year"] {
  font-family: "Noto Sans KR", "Malgun Gothic", sans-serif !important;
}
</style>





<style id="fixed-yellow-date-highlight-v2">
.cell.fixed-yellow-highlight{
  background:#FFF8D8 !important;
}
.cell.fixed-yellow-highlight:hover{
  background:#FFF3C4 !important;
}
</style>


<style id="fixed-blue-date-highlight">
.cell.fixed-blue-highlight{
  background:#E6F0FA !important;
}
.cell.fixed-blue-highlight:hover{
  background:#DCEAF7 !important;
}
</style>

</head>
<body>
<div class="wrap">

  <div class="head">
    <h1>2026년 이슈관리 캘린더
      <small>날짜를 클릭하면 개념·설명과 마케팅 시 주의할 점을 볼 수 있어요</small>
    </h1>
    <div class="legend" id="legend"></div>
  </div>

  <div class="monthnav" id="monthnav"></div>

  <div class="cat-panel" id="catPanel">
    <div class="cat-panel-head">
      <h2 class="cat-panel-title" id="catPanelTitle"></h2>
      <span class="cat-panel-count" id="catPanelCount"></span><div class="cat-panel-note">기존 캘린더와 사용자 제공 표의 중복 기념일은 1개로 통합</div>
    </div>
    <div class="cat-list" id="catList"></div>
  </div>

  <div class="cal-title" id="calTitle"></div>
  <div class="grid" id="grid"></div>

  <div class="note">
    ⓘ 음력 기념일(설날·정월대보름·추석·삼복 등)은 2026년 실제 환산 날짜를 기준으로 표시했습니다. 안전·환경 카테고리의 참사·재난 추모일은 전후 프로모션 톤 조절이 특히 필요한 날짜입니다.
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-date" id="modalDate"></div>
    <div id="modalBody"></div>
    <button class="close-btn" id="closeBtn">닫기</button>
  </div>
</div>

<script>
const CATS = {
  consumer: { label:"소비자·마케팅",       color:"#A9791F", bg:"#F1E7CF" },
  safety:   { label:"안전·환경",           color:"#3F6B5B", bg:"#E4EEE9" },
  rights:   { label:"노동·인권·다양성",    color:"#8A4F7D", bg:"#F1E5EE" },
  history:  { label:"정치·역사",           color:"#2C3E63", bg:"#E4E8F0" },
  culture:  { label:"문화·종교",           color:"#B5473F", bg:"#F4E3DF" },
  sports:   { label:"스포츠",              color:"#5F7A55", bg:"#E6ECDD" },

https://www.law.go.kr/법령/각종기념일등에관한규정"}]}],"10-29":[{"cat":"safety","title":"이태원 참사 (2022)","desc":"2022년 서울 이태원에서 핼러윈 인파가 밀집하며 다수의 사상자가 발생한 참사입니다.","caution":"핼러윈(10월 31일) 시즌 마케팅과 시기가 겹치는 매우 민감한 추모일입니다. 유흥·코스튬·야간 행사 관련 프로모션은 톤과 발행 시점에 각별한 주의가 필요하며, 인파 밀집을 유도하는 이벤트 기획 시 안전 대책을 함께 고려해야 합니다.","links":[{"label":"위키백과 - 이태원 압사 사고","url":"https://ko.wikipedia.org/wiki/이태원_압사_사고"}]},{"cat":"culture","title":"지방자치 및 균형발전의 날","desc":"지방자치 및 균형발전의 날은 문화·교육·가족·종교 또는 공동체의 의미를 되새기는 기념일·행사입니다.","caution":"마케팅·프로모션 소재 활용 시 사회적 맥락과 표현의 적절성을 사전 검토하세요.","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]},{"cat":"consumer","title":"반도체의 날","desc":"반도체의 날은 해당 산업·상품 또는 소비자 생활과 관련된 의미를 알리는 기념일·행사입니다.","caution":"마케팅·프로모션 소재 활용 시 사회적 맥락과 표현의 적절성을 사전 검토하세요.","links":[{"label":"산업통상자원부 - 정책·보도자료","url":"https://www.motie.go.kr/"}]}],"10-31":[{"cat":"safety","title":"핼러윈","desc":"핼러윈은 건강·안전에 대한 인식을 높이고 예방과 실천의 중요성을 알리는 기념일입니다.","caution":"2022년 10·29 이태원 참사와 연계될 수 있는 표현·이미지 및 참사를 희화화하거나 연상시키는 마케팅 소재 사용에 유의하며,\n특히 군중 밀집, 압사, 죽음·공포 등의 소재 활용 시 사회적 정서와 피해자·유가족에 미칠 영향을 고려하여 사전 검토 필요함\n\n<참고사항>\n· 핼러윈 관련 마케팅 시 2022년 10·29 이태원 참사와 연계될 수 있는 표현·이미지 사용에 각별히 주의\n· 압사, 군중 밀집, 비명, 공포 등을 희화화하거나 이벤트 요소로 활용하지 않도록 검토\n· ‘죽음’, ‘참사’, ‘살려줘’ 등 실제 사고를 연상시키는 자극적 카피 사용 지양\n· 이태원·용산 등 참사 발생 장소를 핼러윈 이미지와 결합하여 사용하는 표현 주의\n· 해골·유령·피 등 일반적인 핼러윈 소재도 사회적 참사와 결합될 경우 맥락상 부적절할 수 있음\n· 대규모 오프라인 행사 진행 시 과도한 군중 밀집을 유도하는 홍보 방식 주의\n· 참사 추모기간 또는 관련 사회적 이슈 발생 시 프로모션의 축소·변경 여부 검토\n· SNS 밈·유행어 사용 시 참사 희화화 또는 피해자·유가족에 대한 2차 가해 가능성 점검\n· 디자인·카피 확정 전 날짜·장소·이미지·문구를 함께 보는 맥락 검수 권고","links":[{"label":"(테스트) 광복절 기간 마케팅 이슈 예방 가이드라인","url":"https://gsretail-my.sharepoint.com/:b:/p/gsms1220/IQCHwC8R_HUiSZBZ67_OpeNVARTpRkPl0EZ-V1OPMJsOF2A?e=PPkwR7"}]}],"11-01":[{"cat":"culture","title":"잡지의 날","desc":"잡지의 날은 문화·교육·가족·종교 또는 공동체의 의미를 되새기는 기념일·행사입니다.","caution":"마케팅·프로모션 소재 활용 시 사회적 맥락과 표현의 적절성을 사전 검토하세요.","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]},{"cat ttps://www.motie.go.kr/"}]}],"11-14":[{"cat":"safety","title":"세계 당뇨병의 날","desc":"세계 당뇨병의 날은 건강·안전에 대한 인식을 높이고 예방과 실천의 중요성을 알리는 기념일입니다.","caution":"마케팅·프로모션 소재 활용 시 사회적 맥락과 표현의 적절성을 사전 검토하세요.","links":[{"label":"WHO - Global health days and campaigns","url":"https://www.who.int/campaigns"}]}],"11-16":[{"cat":"rights","title":"세계 관용의 날","desc":"세계 관용의 날은 인권·평등·포용 또는 노동의 가치를 알리고 관련 권리와 사회적 인식을 높이기 위한 기념일입니다.","caution":"마케팅·프로모션 소재 활용 시 사회적 맥락과 표현의 적절성을 사전 검토하세요.","links":[{"label":"UN - International Days and Weeks","url":"https://www.un.org/en/observances/list-days-weeks"}]}],"11-17":[{"cat":"history","title":"순국선열의 날","desc":"순국선열의 날은 대한민국 또는 국제사회의 역사·정치적 의미를 되새기는 기념일입니다.","caution":"마케팅·프로모션 소재 활용 시 사회적 맥락과 표현의 적절성을 사전 검토하세요.","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]}],"11-18":[{"cat":"consumer","title":"대학수학능력시험(수능)일","desc":"2027학년도 대학수학능력시험은 2026년 11월 19일(목)에 시행되는 대학입시 국가시험입니다.","caution":"수험생 응원 마케팅(카페 할인, 응원 이벤트 등)이 활발한 날입니다. 등하교·출근 시간 조정, 항공기 이착륙 제한 등 사회적 배려 문화가 있는 만큼, 소음을 유발하는 옥외광고나 이벤트는 시간대에 유의해야 합니다.\n\n<참고사항>\n· 수능은 수험생·학부모의 관심과 심리적 민감도가 높은 시기인 만큼 시험·성적·합격 등을 활용한 마케팅 표현에 주의\n· 수험생의 불안감이나 입시 부담을 과도하게 자극하여 상품·서비스 구매를 유도하는 표현 지양\n· ‘합격 보장’, ‘등급 상승 보장’, ‘이것만 하면 ○등급’ 등 객관적 근거 없이 특정 결과를 보장하는 표현 주의\n· 특정 점수·등급·대학을 기준으로 수험생을 서열화하거나 낮은 성적을 조롱·희화화하는 카피 및 이미지 사용 지양\n· 시험 실패·재수·불합격 등을 부정적 또는 자극적인 소재로 활용하여 수험생을 비하하거나 불쾌감을 줄 수 있는 표현 주의\n· ‘수능 대박’, ‘합격 기원’, ‘수험생 응원’ 등 일반적인 응원성 표현은 활용 가능하나 상품 효능·구매와 합격을 직접 연결하지 않도록 유의\n· 실제 수능 문제지·성적통지표 등을 모방한 디자인 사용 시 공식 자료로 오인되지 않도록 표현 방식 검토\n· 한국교육과정평가원 등 기관의 명칭·로고·표장 등을 활용하여 공식 제휴·인증·추천을 받은 것으로 오인시키는 표현 주의\n· 수험표 인증 할인 등 수험생 대상 프로모션 진행 시 개인정보가 불필요하게 수집·노출되지 않도록 운영 방식 검토\n· 수능 당일에는 시험 진행에 영향을 줄 수 있는 소음·교통·오프라인 행사 등 프로모션 운영 방식도 함께 고려","links":[{"label":"한국교육과정평가원 - 대학수학능력시험","url":"https://www.suneung.re.kr/"}]},{"cat":"safety","title":"약의 날","desc":"약의 날은 건강·안전에 대한 인식을 높이고 예방과 실천의 중요성을 알리는 기념일입니다.","caution":"마케팅·프로모션 소재 활용 시 사회적 맥락과 표현의 적절성을 사전 검토하세요.","links":[{"label":"국가법령정보센터  형성되지 않도록 사전 검토 필요함.\n\n<참고사항>\n· 12월 12일에는 군사·군대·쿠데타 등을 연상시키는 마케팅 소재 사용에 특히 주의\n· 탱크·장갑차·군인·총기·군복 등 군사 이미지를 당일 프로모션과 결합하는 표현 주의\n· ‘작전 개시’, ‘진격’, ‘점령’, ‘출동’, ‘반란’, ‘쿠데타’ 등의 카피 사용 시 맥락 검토\n· ‘12·12’, ‘1212’ 등의 숫자를 할인율·가격·이벤트명으로 강조할 경우 역사적 의미 확인\n· 상품명이 군사적 표현인 경우 해당 날짜와 우연히 결합되지 않는지 별도 검토\n· 영화·드라마 등 대중문화에서 사용된 12·12 관련 장면·대사를 패러디하는 방식 주의\n· 특정 정치인·군인·역사적 인물을 연상시키는 이미지나 밈 사용 지양\n의도와 무관하게 소비자가 역사적 사건을 희화화한 것으로 받아들일 가능성을 사전 검토\n· 스타벅스 ‘탱크 데이’ 사례처럼 상품명 자체에는 문제가 없어도 날짜와 결합하여 다른 의미가 형성될 수 있음에 유의","links":[{"label":"(테스트) '26년 3분기 GS리테일 리스크 관리 리더십 교육","url":"https://gsretail-my.sharepoint.com/:v:/p/gsms1220/IQDxYUk1OAbWSr2HWIRk2vqZAUCl58I4c0hdtlZsLyEZxw4?nav=eyJyZWZlcnJhbEluZm8iOnsicmVmZXJyYWxBcHAiOiJPbmVEcml2ZUZvckJ1c2luZXNzIiwicmVmZXJyYWxBcHBQbGF0Zm9ybSI6IldlYiIsInJlZmVycmFsTW9kZSI6InZpZXciLCJyZWZlcnJhbFZpZXciOiJNeUZpbGVzTGlua0NvcHkifX0&e=wHk6IN"}]}],"12-18":[{"cat":"rights","title":"세계 이주민의 날","desc":"세계 이주민의 날은 인권·평등·포용 또는 노동의 가치를 알리고 관련 권리와 사회적 인식을 높이기 위한 기념일입니다.","caution":"마케팅·프로모션 소재 활용 시 사회적 맥락과 표현의 적절성을 사전 검토하세요.","links":[{"label":"UN - International Days and Weeks","url":"https://www.un.org/en/observances/list-days-weeks"}]}],"12-20":[{"cat":"rights","title":"세계 연대의 날","desc":"세계 연대의 날은 인권·평등·포용 또는 노동의 가치를 알리고 관련 권리와 사회적 인식을 높이기 위한 기념일입니다.","caution":"마케팅·프로모션 소재 활용 시 사회적 맥락과 표현의 적절성을 사전 검토하세요.","links":[{"label":"UN - International Days and Weeks","url":"https://www.un.org/en/observances/list-days-weeks"}]}],"12-21":[{"cat":"consumer","title":"허니데이","desc":"허니데이는 소비·유통 문화에서 프로모션과 구매 수요가 집중되는 시즌성 마케팅 일정입니다.","caution":"마케팅·프로모션 소재 활용 시 사회적 맥락과 표현의 적절성을 사전 검토하세요.","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]}],"12-24":[{"cat":"culture","title":"크리스마스이브","desc":"크리스마스이브는 문화·교육·가족·종교 또는 공동체의 의미를 되새기는 기념일·행사입니다.","caution":"마케팅·프로모션 소재 활용 시 사회적 맥락과 표현의 적절성을 사전 검토하세요.","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]}],"12-25":[{"cat":"culture","title":"크리스마스","desc":"예수 그리스도의 탄생을 기념하는 기독교의 주요 기념일로 대한민국의 법정공휴일입니다. 2026년 12월 25일은 금요일입니다.","caution":"기독교의 주요 기념일이라는 종교적 의미를 고려하여 종교적 상징·인물·문구를 비하·왜곡·희화화하거나 부적절하게 상업화하는 표현에 유의하고, 특히 십자가·예수·성경 등 종교적 소재 활용 시 특정 종교에 대한 모욕·차별 또는 사회적 갈등을 유발할 가능성이 없는지 검토 필요함\n\n<참고사항>\n· 성탄절은 기독교의 주요 기념일인 만큼 종교적 상징 및 표현 사용 시 존중의 원칙 필요\n· 십자가·예수·성경 등 종교적 상징을 희화화하거나 상품 판매를 위한 자극적 소재로 사용하는 표현 주의\n· 특정 종교를 비하하거나 타 종교와 비교·우열화하는 표현 사용 지양\n· 산타클로스·트리·선물 등 일반적인 크리스마스 문화 소재는 통상적인 마케팅 활용 가능\n· 종교적 의미의 ‘성탄절’과 대중문화적 의미의 ‘크리스마스’를 콘텐츠 목적에 맞게 구분\n· 종교적 문구나 성경 구절을 광고 카피로 변형·패러디할 경우 맥락 및 소비자 반응 검토\n· 음주·유흥·성적 표현 등과 종교적 상징을 직접 결합하는 디자인은 특히 주의\n· 다양한 종교·비종교 고객을 고려하여 특정 종교 참여를 강요하는 듯한 표현 지양\n· 글로벌 캠페인의 경우 국가·문화권별 크리스마스 및 종교 관련 민감도 차이도 함께 검토","links":[{"label":"(테스트) 광복절 기간 마케팅 이슈 예방 가이드라인","url":"https://gsretail-my.sharepoint.com/:b:/p/gsms1220/IQCHwC8R_HUiSZBZ67_OpeNVARTpRkPl0EZ-V1OPMJsOF2A?e=PPkwR7"}]}],"12-27":[{"cat":"history","title":"원자력 안전 및 진흥의 날","desc":"원자력 안전 및 진흥의 날은 대한민국 또는 국제사회의 역사·정치적 의미를 되새기는 기념일입니다.","caution":"마케팅·프로모션 소재 활용 시 사회적 맥락과 표현의 적절성을 사전 검토하세요.","links":[{"label":"국가법령정보센터 - 각종 기념일 등에 관한 규정","url":"https://www.law.go.kr/법령/각종기념일등에관한규정"}]}],"12-29":[{"cat":"safety","title":"제주항공 여객기 참사일","desc":"제주항공 여객기 참사일은 해당 사고·사건의 희생자를 기억하고 안전과 재발 방지의 중요성을 되새기는 날입니다.","caution":"참사 발생일에는 희생자와 유가족에 대한 사회적 정서를 고려하여 항공·비행·추락 등 사고를 연상시키거나 참사를 상업적으로 활용하는 표현에 유의하며, 관련 상품·프로모션·이미지 및 카피가 참사를 희화화하거나 피해자의 고통을 마케팅에 이용하는 것으로 받아들여지지 않도록 사전 검토 필요함\n\n<참고사항>\n· 참사 발생일에는 희생자 및 유가족에 대한 사회적 정서를 고려하여 마케팅 활동에 주의\n· 항공기·비행·착륙·추락·여행 등을 소재로 한 이벤트 및 광고는 특히 신중하게 검토\n· ‘날아가다’, ‘폭발적’, ‘추락’, ‘착륙’, ‘마지막 비행’ 등 사고를 연상시킬 수 있는 표현 주의\n· 항공권·여행상품·공항 관련 프로모션 진행 시 날짜와의 연관성을 사전에 확인\n· 사고 장면이나 유사한 항공기 이미지를 자극적인 광고 소재로 사용하는 행위 지양\n· 참사를 할인·쿠폰·이벤트 등 상업적 프로모션 소재로 직접 활용하지 않도록 주의\n· 추모 메시지를 활용하는 경우에도 브랜드·상품 홍보와 과도하게 결합하지 않도록 검토\n· 지역명을 사용한 표현은 불필요한 지역 낙인이나 갈등을 유발하지 않도록 주의\n· 관련 콘텐츠 게시 전 유가족·피해자 관점에서 불쾌감이나 상업적 이용으로 받아들여질 가능성 검토","links":[{"label":"(테스트) 광복절 기간 마케팅 이슈 예방 가이드라인","url":"https://gsretail-my.sharepoint.com/:b:/p/gsms1220/IQCHwC8R_HUiSZBZ67_OpeNVARTpRkPl0EZ-V1OPMJsOF2A?e=PPkwR7"}]}],"12-31":[{"cat":"consumer","title":"제야의 종 (연말)","desc":"한 해를 마무리하고 새해를 맞이하는 자정 타종 행사로 대표되는 연말 문화입니다.","caution":"인파가 몰리는 야외 행사와 연계될 경우 안전 관리에 대한 사회적 관심이 높은 시기입니다.","links":[{"label":"서울특별시 - 보신각/제야의 종 행사 정보","url":"https://www.seoul.go.kr/"}]},{"cat":"consumer","title":"연말·제야","desc":"연말·제야는 소비·유통 문화에서 프로모션과 구매 수요가 집중되는 시즌성 마케팅 일정입니다.","caution":"마케팅·프로모션 소재 활용 시 사회적 맥락과 표현의 적절성을 사전 검토하세요.","links":[{"label":"서울특별시 - 제야의 종 행사 정보","url":"https://www.seoul.go.kr/"}]}]};
const YEAR = 2026;
const MONTH_NAMES = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
const WD = ["일","월","화","수","목","금","토"];
const TODAY = new Date(2026,0,1); // 2026-01-01 (2026 캘린더 기준)

let activeMonth = 1;
let activeCats = new Set(Object.keys(CATS));
  let selectedCat = null;

function pad(n){ return n<10 ? "0"+n : ""+n; }


// ===== 사용자 제공 기념일 표 추가 데이터 =====
// 동일한 (카테고리+날짜+기념일명)은 1회만 추가되며,
// 날짜가 같아도 기념일명이 다르면 각각 별도 이벤트로 표시됩니다.
const USER_ADDED_EVENTS = [];
function mergeUserAddedEvents(){
  USER_ADDED_EVENTS.forEach(item => {
    if(!EVENTS[item.date]) EVENTS[item.date] = [];

    // 동일 기념일(같은 카테고리·날짜·명칭)은 중복 추가하지 않음
    const duplicated = EVENTS[item.date].some(e =>
      e.cat === item.cat && e.title === item.title
    );
    if(!duplicated){
      EVENTS[item.date].push({
        cat:item.cat,
        title:item.title,
        desc:item.desc,
        caution:item.caution
      });
    }
  });
}

mergeUserAddedEvents();


function renderLegend(){
  const el = document.getElementById("legend");
  el.innerHTML = "";
  Object.entries(CATS).forEach(([key, c])=>{
    const chip = document.createElement("div");
    chip.className = "chip" + (selectedCat === key ? " selected" : "");
    chip.innerHTML = `<span class="dot" style="background:${c.color}"></span>${c.label}`;
    chip.onclick = ()=>{
      if(selectedCat === key){
        selectedCat = null;
        hideCategoryPanel();
      }else{
        selectedCat = key;
        showCategoryPanel(key);
      }
      renderLegend();
    };
    el.appendChild(chip);
  });
}

function renderMonthNav(){
  const el = document.getElementById("monthnav");
  el.innerHTML = "";
  MONTH_NAMES.forEach((name, i)=>{
    const btn = document.createElement("button");
    btn.className = "mbtn" + (activeMonth === i+1 ? " active" : "");
    btn.textContent = name;
    btn.onclick = ()=>{ activeMonth = i+1; renderMonthNav(); renderCalendar(); };
    el.appendChild(btn);
  });
}

function getCategoryEvents(catKey){
  const result = [];
  Object.entries(EVENTS).forEach(([key, events])=>{
    events.forEach(event=>{
      if(event.cat === catKey){
        result.push({key, event});
      }
    });
  });
  result.sort((a,b)=>a.key.localeCompare(b.key));
  return result;
}

const FIXED_BLUE_DATES = new Set(["01-01","10-26","10-29","12-12"]);

function renderCalendar(){
  document.getElementById("calTitle").textContent = `${YEAR}년 ${MONTH_NAMES[activeMonth-1]}`;
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  WD.forEach((w,i)=>{
    const wd = document.createElement("div");
    wd.className = "wd" + (i===0?" sun":i===6?" sat":"");
    wd.textContent = w;
    grid.appendChild(wd);
  });

  const firstDay = new Date(YEAR, activeMonth-1, 1).getDay();
  const daysInMonth = new Date(YEAR, activeMonth, 0).getDate();

  for(let i=0;i<firstDay;i++){
    const empty = document.createElement("div");
    empty.className = "cell empty";
    grid.appendChild(empty);
  }

  for(let d=1; d<=daysInMonth; d++){
    const dow = new Date(YEAR, activeMonth-1, d).getDay();
    const key = pad(activeMonth) + "-" + pad(d);
    const allEvents = EVENTS[key] || [];
    const events = allEvents;
    const isToday = (YEAR===2026 && activeMonth===9 && d===8);

    const cell = document.createElement("div");
    cell.className = "cell" + (dow===0?" sun":dow===6?" sat":"") + (isToday?" today":"") + (events.length? " clickable":"") + (FIXED_BLUE_DATES.has(key)? " fixed-blue-highlight" : (FIXED_YELLOW_DATES.has(key)? " fixed-yellow-highlight":""));

    const num = document.createElement("div");
    num.className = "daynum";
    num.textContent = d;
    cell.appendChild(num);

    if(events.length){
      const eventList = document.createElement("div");
      eventList.className = "dots";
      eventList.style.cssText = "display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden;";

      const visibleEvents = events.slice(0, 4);
      visibleEvents.forEach(e=>{
        const row = document.createElement("div");
        row.style.cssText = "display:flex;align-items:center;gap:5px;width:100%;min-width:0;height:18px;line-height:18px;overflow:hidden;";

        const dot = document.createElement("span");
        dot.className = "dot";
        dot.style.background = CATS[e.cat].color;
        dot.style.flex = "0 0 auto";

        const label = document.createElement("span");
        label.className = "ev-label";
        label.style.cssText = "margin:0;flex:1 1 auto;min-width:0;width:0;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:18px;";
        label.textContent = e.title;

        row.appendChild(dot);
        row.appendChild(label);
        eventList.appendChild(row);
      });

      if(events.length > 4){
        const more = document.createElement("div");
        more.className = "more-events";
        more.textContent = `+ ${events.length - 4}개 더보기`;
        more.style.cssText = "height:16px;line-height:16px;padding-left:14px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;";
        eventList.appendChild(more);
      }

      cell.appendChild(eventList);

      cell.onclick = ()=> openModal(key, events);
    }

    grid.appendChild(cell);
  }

  const totalCells = firstDay + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for(let i=0;i<trailing;i++){
    const empty = document.createElement("div");
    empty.className = "cell empty";
    grid.appendChild(empty);
  }
}

function openModal(key, events){
  const [mm, dd] = key.split("-");
  document.getElementById("modalDate").textContent = `${YEAR}년 ${parseInt(mm)}월 ${parseInt(dd)}일`;
  const body = document.getElementById("modalBody");
  body.innerHTML = "";
  events.forEach(e=>{
    const c = CATS[e.cat];
    const links = e.links || [];
    const refHtml = links.length
      ? `<ul class="ref-list">${links.map(l=>`<li><a href="${l.url}" target="_blank" rel="noopener noreferrer">${l.label}</a></li>`).join("")}</ul>`
      : `<div class="ref-empty">등록된 참고자료가 없습니다. links 필드에 추가해보세요.</div>`;
    const card = document.createElement("div");
    card.className = "ev-card";
    card.innerHTML = `
      <span class="badge" style="background:${c.bg};color:${c.color}">${c.label}</span>
      <div class="ev-title">${e.title}</div>
      <div class="ev-sec-label">개념 · 설명</div>
      <p class="ev-sec-text">${e.desc}</p>
      <div class="ev-sec-label">마케팅 시 주의할 점</div>
      <div class="caution-box" style="white-space:pre-line"><p class="ev-sec-text">${e.caution}</p></div>
      <div class="ev-sec-label" style="margin-top:12px;">참고자료</div>
      <div class="ref-box">${refHtml}</div>
    `;
    body.appendChild(card);
  });
  document.getElementById("overlay").classList.add("show");
}

function closeModal(){
  document.getElementById("overlay").classList.remove("show");
}

<script id="caution-auto-hanging-final-script">
(function(){
  function applyCautionLayout(root){
    (root || document).querySelectorAll('.caution-box .ev-sec-text').forEach(el=>{
      if(el.dataset.autoIndentDone==='1') return;

      const raw=(el.textContent||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
      if(!raw.trim()) return;

      const lines=raw.split('\n');
      const frag=document.createDocumentFragment();

      lines.forEach(line=>{
        const t=line.trim();

        if(t===''){
          const gap=document.createElement('div');
          gap.className='caution-gap';
          frag.appendChild(gap);
          return;
        }

        if(/^·\s*/.test(t)){
          const item=document.createElement('div');
          item.className='caution-item';

          const dot=document.createElement('span');
          dot.className='caution-dot';
          dot.textContent='·';

          const text=document.createElement('span');
          text.className='caution-item-text';
          text.textContent=t.replace(/^·\s*/,'');

          item.appendChild(dot);
          item.appendChild(text);
          frag.appendChild(item);
          return;
        }

        const summary=document.createElement('div');
        summary.className='caution-summary';
        summary.textContent=t;
        frag.appendChild(summary);
      });

      el.textContent='';
      el.appendChild(frag);
      el.dataset.autoIndentDone='1';
    });
  }

  function run(){ applyCautionLayout(document); }

  document.addEventListener('DOMContentLoaded', run);

  // 팝업이 클릭 후 동적으로 생성되므로 DOM 변화 때마다 자동 적용
  new MutationObserver(run).observe(document.documentElement,{
    childList:true,
    subtree:true
  });

  // 클릭 직후에도 한 번 더 적용
  document.addEventListener('click',()=>setTimeout(run,0),true);
})();
</script>
